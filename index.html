s (Go: RuneCount vs len)\nprint(\" a,b ,c \".strip().split(\",\"))\nprint(\"-\".join([\"x\", \"y\", \"z\"]))\nprint(\"abc\"[::-1], \"go\" * 3, \"py\" in \"python\")", "title": null}, {"t": "p", "h": "<code>str<\/code> is always Unicode text and <code>bytes<\/code> is a separate type, so there is no rune-vs-byte indexing confusion. Encode and decode explicitly at I/O boundaries: <code>s.encode()<\/code> and <code>b.decode()<\/code>."}, {"t": "ex", "id": "ex-parse-kv", "title": "Parse a key=value config string", "prompt": "<p>Write <code>parse_kv(s)<\/code> that turns <code>\"a=1, b = 2,c=3\"<\/code> into <code>{\"a\": \"1\", \"b\": \"2\", \"c\": \"3\"}<\/code>.<\/p><ul><li>Trim whitespace around keys and values<\/li><li>Skip empty segments<\/li><li>Split on the <b>first<\/b> <code>=<\/code> only (values may contain <code>=<\/code>)<\/li><li>Raise <code>ValueError<\/code> for a segment with no <code>=<\/code><\/li><\/ul>", "starter": "def parse_kv(s: str) -> dict[str, str]:\n    ...", "tests": "assert parse_kv(\"a=1, b = 2,c=3\") == {\"a\": \"1\", \"b\": \"2\", \"c\": \"3\"}, parse_kv(\"a=1, b = 2,c=3\")\nassert parse_kv(\"\") == {}\nassert parse_kv(\"url=http://x?y=1\") == {\"url\": \"http://x?y=1\"}, \"split on the first '=' only\"\nassert parse_kv(\"a=1,,b=2\") == {\"a\": \"1\", \"b\": \"2\"}\ntry:\n    parse_kv(\"a=1,oops\")\nexcept ValueError:\n    pass\nelse:\n    raise AssertionError(\"expected ValueError for 'oops'\")\nprint(\"all good\")", "solution": "def parse_kv(s: str) -> dict[str, str]:\n    out: dict[str, str] = {}              # annotate empty containers so mypy knows the types\n    for part in s.split(\",\"):             # \"a=1, b = 2\" -> [\"a=1\", \" b = 2\"]\n        part = part.strip()               # strings are immutable: strip() returns a new str\n        if not part:                      # empty string is falsy -> skips \",,\" segments\n            continue\n        if \"=\" not in part:               # `in` does substring search on str\n            raise ValueError(f\"bad segment: {part!r}\")   # !r = repr(), shows quotes\n        k, v = part.split(\"=\", 1)         # maxsplit=1: values may contain \"=\" (URLs!)\n        out[k.strip()] = v.strip()\n    return out", "hint": "<code>str.split(\",\")<\/code>, <code>.strip()<\/code>, and <code>part.split(\"=\", 1)<\/code> (the 1 is maxsplit)."}]}, {"id": "collections", "section": "Foundations", "title": "Lists, dicts, sets & comprehensions", "sub": "Slices and maps, but with different aliasing rules.", "learn": ["list/dict/set/tuple vs slice/map", "Copy vs alias semantics", "Comprehensions and sorting with keys", "Counter, defaultdict, deque"], "blocks": [{"t": "h", "h": "The four core collections, and what each one is for"}, {"t": "p", "h": "Python has four built-in collections you'll use every day. They differ in three ways: <b>ordered or not<\/b>, <b>changeable (mutable) or not<\/b>, and <b>how you look things up<\/b> (by position, or by key). Pick by asking: &ldquo;do I need order? do I need lookup by key? will it change? can it have duplicates?&rdquo;"}, {"t": "concepts", "items": [{"name": "list", "go": "<code>[]T<\/code> (slice)", "what": "An ordered, growable sequence. Items are found by <b>position<\/b> (<code>xs[0]<\/code>) and can repeat. Mutable: you can append, insert, remove and sort it in place.", "use": "Order matters, you'll add or remove items, or duplicates are allowed. The default &ldquo;bunch of things&rdquo; type: rows from a DB, search results, a queue of tasks.", "avoid": "You check membership a lot (<code>x in xs<\/code> scans the whole list: use a set), or you look things up by a key (use a dict).", "ex": "xs = [\"b\", \"a\", \"b\"]\nxs.append(\"c\")\nxs.sort()       # a, b, b, c"}, {"name": "tuple", "go": "a small fixed struct, or a multiple return value", "what": "An ordered, <b>immutable<\/b> sequence. Once made it can't change. Usually small, and often mixed types: <code>(lat, lon)<\/code>, <code>(status, body)<\/code>.", "use": "A fixed group of values that belong together: returning several values, coordinates, dict keys made of several parts (tuples are hashable).", "avoid": "The data changes over time (use a list), or the fields deserve names (use a dataclass or NamedTuple).", "ex": "point = (35.2, -80.8)\nlat, lon = point   # unpacking"}, {"name": "dict", "go": "<code>map[K]V<\/code>", "what": "Key → value pairs with <b>fast lookup by key<\/b>. Keys are unique and must be hashable (str, int, tuple…). Keeps insertion order (Go maps don't).", "use": "You look things up by an id or name, count or group things, or represent JSON-like records and config. If you'd reach for a map in Go, it's a dict.", "avoid": "You only need a list of items with no lookups, or the record has a fixed known shape that's passed around widely (use a dataclass or pydantic model so typos are caught).", "ex": "ages = {\"ana\": 25, \"bo\": 31}\nages[\"cy\"] = 40\nages.get(\"dee\", 0)  # 0, no KeyError"}, {"name": "set", "go": "<code>map[T]struct{}<\/code>", "what": "An unordered collection of <b>unique<\/b> items with very fast <code>in<\/code> checks, plus set maths: union <code>|<\/code>, intersection <code>&amp;<\/code>, difference <code>-<\/code>.", "use": "Removing duplicates, &ldquo;have I seen this?&rdquo; checks, and comparing two groups (which users are in both? which ids are missing?).", "avoid": "You need order or duplicates (use a list), or you need to attach a value to each item (use a dict).", "ex": "seen = {\"a\", \"b\"}\n\"a\" in seen         # instant, any size\n{\"a\", \"b\"} - {\"b\"}  # {'a'}"}]}, {"t": "h", "h": "Specialised collections worth knowing"}, {"t": "concepts", "items": [{"name": "collections.deque", "go": "a ring buffer / double-ended queue", "what": "A list-like sequence that's fast to add and remove at <b>both<\/b> ends. Optional <code>maxlen<\/code> keeps only the last N items.", "use": "Queues (FIFO), sliding windows, &ldquo;last N events&rdquo;, BFS in graphs.", "avoid": "You need random access in the middle (indexing a deque is slower than a list).", "ex": "from collections import deque\nq = deque(maxlen=3)\nq.append(1)\nq.popleft()"}, {"name": "collections.Counter", "go": "<code>map[T]int<\/code> for counting", "what": "A dict that counts things. Missing keys read as 0, and <code>most_common(n)<\/code> gives the top n.", "use": "Frequencies: words, status codes, errors per endpoint, votes.", "avoid": "You need anything other than counts as values.", "ex": "from collections import Counter\nCounter(\"banana\").most_common(1)\n# [('a', 3)]"}, {"name": "collections.defaultdict", "go": "map + &ldquo;create on first access&rdquo;", "what": "A dict that builds a default value (an empty list, 0, a set) the first time you touch a missing key.", "use": "Grouping: <code>by_user[user].append(order)<\/code> without checking whether the key exists first.", "avoid": "You want missing keys to be an error (a plain dict raises <code>KeyError<\/code>, which catches typos).", "ex": "from collections import defaultdict\ngroups = defaultdict(list)\ngroups[\"ana\"].append(1)"}, {"name": "frozenset", "go": "an immutable set", "what": "A set that can't change, which makes it hashable, so it can be a dict key or live inside another set.", "use": "Using a group of items as a key, e.g. caching by an unordered set of tags.", "avoid": "You need to add or remove items.", "ex": "perms = {frozenset({\"read\", \"write\"}): \"editor\"}"}]}, {"t": "h", "h": "Which one should I use?"}, {"t": "table", "head": ["If you need…", "Use"], "rows": [["An ordered bunch of items you'll add to, loop over, or sort", "<code>list<\/code>"], ["A few values that belong together and won't change", "<code>tuple<\/code> (or a NamedTuple/dataclass if the fields need names)"], ["To find a value by an id, name or other key", "<code>dict<\/code>"], ["Uniqueness, or fast &ldquo;is X in here?&rdquo; checks", "<code>set<\/code>"], ["To count occurrences", "<code>Counter<\/code>"], ["To group items under keys", "<code>defaultdict(list)<\/code>"], ["A queue, or only the last N items", "<code>deque<\/code>"], ["A record with a fixed set of named fields", "Not a dict: a <code>@dataclass<\/code> (Module 5)"], ["A huge numeric table or matrix", "NumPy / pandas (Modules 24 and 25)"]]}, {"t": "h", "h": "How fast is each operation?"}, {"t": "p", "h": "This is the practical reason the choice matters. &ldquo;O(1)&rdquo; means the cost doesn't grow with size, and &ldquo;O(n)&rdquo; means it grows with the number of items."}, {"t": "table", "head": ["Operation", "list", "dict / set", "deque"], "rows": [["Look up by position <code>xs[i]<\/code>", "O(1)", "n/a", "O(n) in the middle"], ["Membership <code>x in c<\/code>", "<b>O(n)<\/b>: scans everything", "<b>O(1)<\/b>", "O(n)"], ["Add at the end", "O(1)", "O(1)", "O(1)"], ["Add or remove at the front", "<b>O(n)<\/b>: shifts everything", "n/a", "<b>O(1)<\/b>"], ["Look up or delete by key", "n/a", "O(1)", "n/a"], ["Sort", "O(n log n), in place", "n/a (use <code>sorted(d)<\/code>)", "n/a"]]}, {"t": "run", "code": "import time\n\nids = list(range(200_000))\nid_set = set(ids)                     # same data, different structure\nlookups = range(199_900, 200_000)     # 100 lookups near the end\n\nt = time.perf_counter()\nhits = sum(1 for x in lookups if x in ids)       # list: each `in` scans ~200k items\nt_list = time.perf_counter() - t\n\nt = time.perf_counter()\nhits2 = sum(1 for x in lookups if x in id_set)   # set: each `in` is a hash lookup\nt_set = time.perf_counter() - t\n\nprint(hits == hits2, f\"list {t_list*1000:.0f}ms vs set {t_set*1000:.2f}ms\")", "title": "why the choice matters: list vs set lookups"}, {"t": "h", "h": "Side by side with Go"}, {"t": "cmp", "go": "xs := []int{1, 2, 3}\nxs = append(xs, 4)            // may reallocate the backing array\n\nm := map[string]int{\"a\": 1}\nv, ok := m[\"b\"]               // zero value + ok flag\n\nseen := map[string]struct{}{} // Go's \"set\" idiom\nseen[\"x\"] = struct{}{}", "py": "xs = [1, 2, 3]\nxs.append(4)          # mutates in place, returns None\n\nm = {\"a\": 1}\nv = m.get(\"b\")        # None if missing (or m.get(\"b\", 0) for a default)\nok = \"b\" in m         # membership test: no two-value lookup in Python\n\nseen = set()          # a real set type: add, remove, |, &, -\nseen.add(\"x\")", "note": null}, {"t": "tip", "kind": "warn", "h": "<code>m[\"missing\"]<\/code> raises <code>KeyError<\/code> because there are no zero values. Use <code>.get()<\/code>, <code>in<\/code>, or <code>collections.defaultdict<\/code>."}, {"t": "tip", "kind": "go", "h": "<b>Slicing copies.<\/b> <code>ys = xs[1:3]<\/code> is a new list, whereas in Go it shares the backing array. Plain assignment <code>ys = xs<\/code> <i>aliases<\/i>: both names point at the same list. Copy explicitly with <code>xs.copy()<\/code> or <code>list(xs)<\/code>."}, {"t": "run", "code": "xs = [1, 2, 3, 4, 5]\nys = xs[1:3]\nys[0] = 99\nprint(xs, ys)           # xs untouched: slicing copied\n\nzs = xs\nzs[0] = -1\nprint(xs)               # aliased: same object\n\nprint(xs[-1], xs[::-1], xs[::2])   # negative index, reverse, step", "title": null}, {"t": "h", "h": "Comprehensions"}, {"t": "p", "h": "Comprehensions replace most of the <code>for<\/code> + <code>append<\/code> loops you'd write in Go. Keep them to one <code>for<\/code> and one <code>if<\/code>; beyond that, a plain loop is easier to read."}, {"t": "run", "code": "orders = [\n    {\"id\": 1, \"user\": \"ana\", \"total\": 30.0, \"status\": \"paid\"},\n    {\"id\": 2, \"user\": \"bo\",  \"total\": 12.5, \"status\": \"refunded\"},\n    {\"id\": 3, \"user\": \"ana\", \"total\": 99.9, \"status\": \"paid\"},\n]\n\n# list comprehension = filter in one expression: [expr for x in xs if cond]\npaid = [o for o in orders if o[\"status\"] == \"paid\"]\n# dict comprehension: build a map id -> total\ntotals = {o[\"id\"]: o[\"total\"] for o in orders}\n# set comprehension: unique users\nusers = {o[\"user\"] for o in orders}\n# generator expression inside sum(): no intermediate list is built\nrevenue = sum(o[\"total\"] for o in paid)\n\nprint(len(paid), totals, sorted(users), round(revenue, 2))\n\n# enumerate gives (index, item), like `for i, o := range orders` (start=1 for humans)\nfor i, o in enumerate(orders, start=1):\n    print(i, o[\"user\"])\n\n# sorted() returns a NEW list; key= says what to compare (like sort.Slice's less func)\ntop = sorted(orders, key=lambda o: o[\"total\"], reverse=True)[:2]\nprint([o[\"id\"] for o in top])\n\n# zip walks lists in lockstep; strict=True raises if lengths differ (catches bugs)\nfor a, b in zip([\"x\", \"y\"], [1, 2], strict=True):\n    print(a, b)", "title": null}, {"t": "table", "head": ["Style", "Use it when"], "rows": [["Comprehension <code>[f(x) for x in xs if p(x)]<\/code>", "Building a new list, dict or set from another iterable with a simple transform or filter. The default."], ["Generator expression <code>sum(f(x) for x in xs)<\/code>", "The result goes straight into a function (<code>sum<\/code>, <code>max<\/code>, <code>any<\/code>, <code>\"\".join<\/code>), so no list is needed."], ["Plain <code>for<\/code> loop", "Several statements per item, side effects (writing, printing, calling APIs), early <code>break<\/code>, or anything a comprehension would make hard to read."], ["<code>map<\/code> / <code>filter<\/code>", "Rarely; comprehensions are usually clearer. Occasionally <code>map(str, xs)<\/code> is tidy."]]}, {"t": "h", "h": "The collections module"}, {"t": "run", "code": "from collections import Counter, defaultdict, deque\n\nhits = Counter([\"/a\", \"/b\", \"/a\", \"/c\", \"/a\"])\nprint(hits.most_common(2))\n\nby_user = defaultdict(list)\nfor user, order_id in [(\"ana\", 1), (\"bo\", 2), (\"ana\", 3)]:\n    by_user[user].append(order_id)\nprint(dict(by_user))\n\nwindow = deque(maxlen=3)   # ring buffer\nfor n in range(6):\n    window.append(n)\nprint(list(window))\n\nfirst, *rest = [1, 2, 3, 4]    # star-unpacking\nprint(first, rest)", "title": null}, {"t": "tip", "kind": "go", "h": "Dicts keep <b>insertion order<\/b> (guaranteed by the language), unlike Go's randomised map iteration. Tuples are immutable and hashable, so they work as dict keys: <code>cache[(user_id, day)] = ...<\/code>."}, {"t": "h", "h": "Why dict keys must be hashable"}, {"t": "p", "h": "A <code>dict<\/code> or <code>set<\/code> is a hash table, just like a Go map. Go only allows comparable key types and checks that at compile time; Python checks at runtime by calling <code>hash()<\/code>. Immutable built-ins are hashable, but <code>list<\/code>, <code>dict<\/code> and <code>set<\/code> aren't: if a key could change after insertion its hash would change, and the entry would be lost in the wrong bucket. For composite keys use a tuple, a <code>frozenset<\/code>, or a frozen dataclass."}, {"t": "run", "code": "cache = {}\ncache[(\"ana\", \"2026-11-20\")] = 3          # tuple key: fine (like a struct key in Go)\ntry:\n    cache[[\"ana\", \"2026-11-20\"]] = 3      # list key: refused, lists are mutable\nexcept TypeError as e:\n    print(\"TypeError:\", e)\n\nprint(hash((1, 2)) == hash((1, 2)))       # equal values → equal hashes\n\nfrom dataclasses import dataclass\n\n@dataclass(frozen=True)                   # frozen → __hash__ is generated → usable as a key\nclass Point:\n    x: int\n    y: int\n\nvisited = {Point(0, 0), Point(0, 0), Point(1, 2)}\nprint(visited)                            # the duplicate collapsed", "title": null}, {"t": "ex", "id": "ex-top-words", "title": "Top N words", "prompt": "<p>Write <code>top_words(text, n)<\/code> returning the <code>n<\/code> most frequent words as <code>(word, count)<\/code> tuples.<\/p><ul><li>Lowercase everything<\/li><li>Split on whitespace and strip <code>.,!?;:<\/code> from each word's ends<\/li><li>Ignore empty words<\/li><li>Sort by count descending, then word ascending<\/li><\/ul>", "starter": "def top_words(text: str, n: int) -> list[tuple[str, int]]:\n    ...", "tests": "text = \"Go is fast. Python is fun! go, GO; python?\"\ngot = top_words(text, 3)\nassert got == [(\"go\", 3), (\"is\", 2), (\"python\", 2)], got\nassert top_words(\"\", 5) == []\nassert top_words(\"b a\", 5) == [(\"a\", 1), (\"b\", 1)], \"ties break alphabetically\"\nprint(\"all good\")", "solution": "from collections import Counter\n\ndef top_words(text: str, n: int) -> list[tuple[str, int]]:\n    words = [w.strip(\".,!?;:\").lower() for w in text.split()]\n    counts = Counter(w for w in words if w)\n    return sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:n]", "hint": "Use <code>Counter<\/code>, then <code>sorted(..., key=lambda kv: (-kv[1], kv[0]))<\/code>. Tuples compare element by element."}]}, {"id": "structs", "section": "Foundations", "title": "Structs → dataclasses & enums", "sub": "Your domain types, the Pythonic way.", "learn": ["@dataclass (frozen, slots, defaults)", "Methods, properties, validation", "Operator overloading via dunder methods", "Enums instead of iota"], "blocks": [{"t": "cmp", "go": "type User struct {\n\tID    int\n\tEmail string\n\tTags  []string           // nil slice by default\n}\n\n// value receiver: gets a copy of u\nfunc (u User) Domain() string {\n\treturn strings.Split(u.Email, \"@\")[1]\n}\n\nu := User{ID: 1, Email: \"a@x.io\"}", "py": "from dataclasses import dataclass, field\n\n@dataclass                 # generates __init__, __repr__, __eq__\nclass User:\n    id: int                # fields are declared with type hints\n    email: str\n    # mutable defaults need a factory, or every User would share ONE list\n    tags: list[str] = field(default_factory=list)\n\n    def domain(self) -> str:      # self = explicit receiver (always \"by reference\")\n        return self.email.split(\"@\")[1]\n\nu = User(id=1, email=\"a@x.io\")    # keyword args read like a struct literal", "note": null}, {"t": "p", "h": "<code>self<\/code> is the receiver, and you name it explicitly. Every method behaves like a <b>pointer receiver<\/b>: objects are passed by reference, so mutating <code>self<\/code> mutates the caller's object. Nothing gets value-copied, and <code>b = a<\/code> shares the same object."}, {"t": "run", "code": "from dataclasses import dataclass, replace, asdict\n\n@dataclass(frozen=True, slots=True)   # immutable + memory-lean\nclass Point:\n    x: float\n    y: float\n\n    def __add__(self, other: \"Point\") -> \"Point\":   # operator overloading\n        return Point(self.x + other.x, self.y + other.y)\n\np = Point(1, 2)\nq = replace(p, y=10)            # copy with changes\nprint(p, q, p + q)\nprint(p == Point(1, 2))          # __eq__ generated for you\nprint(asdict(q))\ntry:\n    p.x = 5\nexcept Exception as e:\n    print(type(e).__name__, e)", "title": "frozen dataclasses"}, {"t": "h", "h": "Validation & computed properties"}, {"t": "run", "code": "from dataclasses import dataclass\n\n@dataclass\nclass Account:\n    owner: str\n    balance_cents: int = 0        # store money as integer cents, never float\n\n    def __post_init__(self) -> None:\n        # runs right after the generated __init__: the place for invariants,\n        # like a Go NewAccount() constructor that returns an error\n        if self.balance_cents < 0:\n            raise ValueError(\"balance cannot be negative\")\n\n    @property\n    def balance(self) -> float:\n        # computed, read-only attribute: callers write a.balance (no parentheses)\n        return self.balance_cents / 100\n\n    def deposit(self, cents: int) -> None:\n        self.balance_cents += cents   # mutates the object the caller holds\n\na = Account(\"ana\", 1050)\na.deposit(250)\nprint(a, a.balance)\n\ntry:\n    Account(\"bo\", -1)              # invariant enforced at construction time\nexcept ValueError as e:\n    print(\"rejected:\", e)", "title": null}, {"t": "h", "h": "Which kind of “struct” should I use?"}, {"t": "p", "h": "Go has one way to define a record: <code>struct<\/code>. Python has several, and choosing well matters. Here's what each is and when it fits."}, {"t": "concepts", "items": [{"name": "dict", "go": "<code>map[string]any<\/code>", "what": "A free-form bag of keys. No fixed fields, and nothing checks the keys.", "use": "Truly dynamic data: arbitrary JSON you just pass through, counters, lookup tables.", "avoid": "A record with known fields that travels through your code: a typo like <code>user[\"emial\"]<\/code> is only found at runtime.", "ex": "user = {\"id\": 1, \"email\": \"a@x.io\"}"}, {"name": "@dataclass", "go": "<code>struct<\/code> + methods", "what": "A class with generated <code>__init__<\/code>, <code>__repr__<\/code> and <code>__eq__<\/code> from typed fields. Can be frozen (immutable) and have methods.", "use": "Your internal domain objects: Order, Money, Config, anything you'd make a Go struct. The default choice.", "avoid": "Parsing untrusted input (it doesn't validate types; use pydantic), or a tiny throwaway pair (a tuple is fine).", "ex": "@dataclass\nclass User:\n    id: int\n    email: str"}, {"name": "pydantic BaseModel", "go": "struct + JSON tags + a validator", "what": "Like a dataclass, but it <b>parses and validates<\/b> data at runtime (types, constraints), and converts to and from JSON.", "use": "The edges of your system: HTTP request/response bodies, config from env vars, queue messages, LLM outputs.", "avoid": "Hot inner loops over millions of objects (validation costs time), or plain internal data that's already trusted.", "ex": "class UserIn(BaseModel):\n    email: str = Field(min_length=3)\nUserIn.model_validate_json(raw)"}, {"name": "typing.NamedTuple", "go": "a small immutable struct", "what": "An immutable tuple whose positions also have names: <code>p.x<\/code> and <code>p[0]<\/code> both work.", "use": "Small immutable values that also need to unpack or sort like tuples (rows, coordinates).", "avoid": "Anything with many fields or behaviour; a frozen dataclass is usually clearer.", "ex": "class Point(NamedTuple):\n    x: float\n    y: float"}, {"name": "typing.TypedDict", "go": "a type annotation for a map's shape", "what": "A plain dict at runtime, but with a declared shape that mypy checks. Creates no new object type.", "use": "Describing JSON or dicts you receive and don't want to convert (API payloads, <code>**kwargs<\/code> shapes).", "avoid": "You want runtime validation (pydantic) or methods (dataclass).", "ex": "class Event(TypedDict):\n    type: str\n    user_id: int"}, {"name": "plain class", "go": "a struct with hand-written constructor", "what": "A regular <code>class<\/code> where you write <code>__init__<\/code> yourself.", "use": "Objects that are mostly <b>behaviour<\/b> with private state: services, clients, repositories, a RateLimiter.", "avoid": "Simple data holders: you'd be hand-writing what @dataclass generates.", "ex": "class OrderService:\n    def __init__(self, repo):\n        self._repo = repo"}]}, {"t": "table", "head": ["Situation", "Pick"], "rows": [["Data coming <b>in<\/b> from outside (HTTP, env, files, queues, LLMs)", "pydantic <code>BaseModel<\/code>"], ["Your own domain objects inside the app", "<code>@dataclass<\/code> (frozen when they shouldn't change)"], ["An object that mainly <i>does<\/i> things (holds a DB client, has methods)", "a plain class"], ["Typing a dict you get from a library and won't convert", "<code>TypedDict<\/code>"], ["A tiny immutable record that should behave like a tuple", "<code>NamedTuple<\/code>"], ["Genuinely dynamic keys", "<code>dict<\/code>"]]}, {"t": "h", "h": "Why self is explicit, and @classmethod / @staticmethod"}, {"t": "p", "h": "<code>obj.method(x)<\/code> is shorthand for <code>Class.method(obj, x)<\/code>, exactly like Go's method expression <code>T.Method(v, x)<\/code>. Python just makes the receiver an ordinary first parameter, so you name it, conventionally <code>self<\/code>. <code>@classmethod<\/code> receives the <i>class<\/i> instead of an instance, which is the idiomatic way to write alternative constructors (Go's <code>NewX<\/code> / <code>ParseX<\/code> functions). <code>@staticmethod<\/code> receives neither; it's a plain function namespaced inside the class, and often a module-level function is clearer."}, {"t": "run", "code": "from dataclasses import dataclass\n\n@dataclass\nclass Duration:\n    seconds: float\n\n    def minutes(self) -> float:              # instance method: gets the instance\n        return self.seconds / 60\n\n    @classmethod\n    def parse(cls, text: str) -> \"Duration\":  # gets the CLASS: an alternative constructor\n        num, unit = float(text[:-1]), text[-1]\n        factor = {\"s\": 1, \"m\": 60, \"h\": 3600}[unit]\n        return cls(num * factor)             # cls(...) so subclasses build their own type\n\n    @staticmethod\n    def is_valid(text: str) -> bool:         # no self, no cls: a namespaced helper\n        return len(text) > 1 and text[-1] in \"smh\"\n\nd = Duration.parse(\"90m\")\nprint(d, d.minutes())\nprint(Duration.minutes(d))                   # what d.minutes() really does\nprint(Duration.is_valid(\"5x\"))", "title": null}, {"t": "h", "h": "The data model: how built-ins work on your objects"}, {"t": "p", "h": "<code>len(x)<\/code>, <code>for v in x<\/code>, <code>x == y<\/code>, <code>x[k]<\/code>, <code>with x:<\/code> and <code>print(x)<\/code> all call special &ldquo;dunder&rdquo; (double underscore) methods on the object. It's Python's version of Go's small standard interfaces such as <code>fmt.Stringer<\/code> and <code>sort.Interface<\/code>: implement the method, and the built-in syntax works with your type."}, {"t": "table", "head": ["You write", "Python calls", "Go equivalent"], "rows": [["<code>print(x)<\/code>, <code>str(x)<\/code>", "<code>__str__<\/code> (falls back to <code>__repr__<\/code>)", "<code>String() string<\/code>"], ["<code>repr(x)<\/code>, logs, debugger", "<code>__repr__<\/code>", "<code>%#v<\/code>"], ["<code>len(x)<\/code>", "<code>__len__<\/code>", "<code>len<\/code> on built-ins only"], ["<code>for v in x<\/code>", "<code>__iter__<\/code>, then <code>__next__<\/code>", "<code>range<\/code> over built-ins / iterator funcs"], ["<code>k in x<\/code>", "<code>__contains__<\/code>", "none"], ["<code>x[k]<\/code>", "<code>__getitem__<\/code>", "indexing built-ins only"], ["<code>x == y<\/code>, dict keys", "<code>__eq__<\/code>, <code>__hash__<\/code>", "<code>==<\/code> on comparable types"], ["<code>x &lt; y<\/code>, <code>sorted()<\/code>", "<code>__lt__<\/code>", "<code>sort.Interface<\/code>'s Less / <code>cmp<\/code>"], ["<code>if x:<\/code>", "<code>__bool__<\/code> (or <code>__len__<\/code>)", "none"], ["<code>with x:<\/code>", "<code>__enter__<\/code> / <code>__exit__<\/code>", "the defer pattern"], ["<code>x + y<\/code>", "<code>__add__<\/code>", "none (no operator overloading)"]]}, {"t": "run", "code": "class Inventory:\n    def __init__(self) -> None:\n        self._items: dict[str, int] = {}     # leading _ = private by convention\n\n    def add(self, sku: str, qty: int = 1) -> None:\n        self._items[sku] = self._items.get(sku, 0) + qty\n\n    def __len__(self) -> int:                # len(inv)\n        return len(self._items)\n\n    def __contains__(self, sku: str) -> bool:  # \"apple\" in inv\n        return sku in self._items\n\n    def __iter__(self):                      # for sku in inv\n        return iter(sorted(self._items))\n\n    def __getitem__(self, sku: str) -> int:  # inv[\"apple\"]\n        return self._items[sku]\n\n    def __repr__(self) -> str:               # shown by print(), logs, the debugger\n        return f\"Inventory({self._items})\"\n\ninv = Inventory()\ninv.add(\"apple\", 3); inv.add(\"pear\")\nprint(len(inv), \"apple\" in inv, list(inv), inv[\"apple\"], inv)\nprint(bool(Inventory()))                     # empty → falsy, because __len__ returns 0", "title": "dunder methods"}, {"t": "ex", "id": "ex-version", "title": "A sortable Version type", "prompt": "<p>Finish <code>Version<\/code> so that:<\/p><ul><li><code>Version.parse(\"1.10.2\")<\/code> and <code>Version.parse(\"v1.10.2\")<\/code> work (a <code>@classmethod<\/code>); anything that isn't three numbers raises <code>ValueError<\/code><\/li><li>Versions sort <b>numerically<\/b>: 1.9.10 &lt; 1.10.0 (sorting the strings gets this wrong)<\/li><li><code>str(v)<\/code> gives <code>\"1.10.2\"<\/code><\/li><li>Versions are hashable, so they can go in a set<\/li><\/ul>", "starter": "from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Version:\n    major: int\n    minor: int\n    patch: int\n\n    # TODO: make versions sortable (hint: a dataclass option, or __lt__)\n    # TODO: @classmethod parse(cls, text) accepting \"1.2.3\" and \"v1.2.3\"; ValueError otherwise\n    # TODO: __str__ returning \"1.2.3\"", "tests": "vs = [Version.parse(s) for s in [\"1.10.0\", \"1.9.3\", \"v2.0.0\", \"1.9.10\"]]\ngot = [str(v) for v in sorted(vs)]\nassert got == [\"1.9.3\", \"1.9.10\", \"1.10.0\", \"2.0.0\"], got\nassert sorted([\"1.10.0\", \"1.9.3\"]) == [\"1.10.0\", \"1.9.3\"]   # strings sort wrongly: that's the point\nassert Version.parse(\"1.2.3\") == Version(1, 2, 3)\nassert Version.parse(\"1.2.3\") < Version.parse(\"1.2.10\")\nassert len({Version.parse(\"1.0.0\"), Version(1, 0, 0)}) == 1, \"must be hashable, and equal values must match\"\nassert max(vs) == Version(2, 0, 0)\nfor bad in [\"1.2\", \"1.x.3\", \"\"]:\n    try:\n        Version.parse(bad)\n    except ValueError:\n        pass\n    else:\n        raise AssertionError(f\"{bad!r} should raise ValueError\")\nprint(\"all good\")", "solution": "from dataclasses import dataclass\n\n# order=True generates __lt__, __le__, __gt__, __ge__ that compare the fields\n# in declaration order, like comparing (major, minor, patch) tuples.\n# frozen=True + the generated __eq__ gives a matching __hash__ → usable in sets.\n@dataclass(frozen=True, order=True)\nclass Version:\n    major: int\n    minor: int\n    patch: int\n\n    @classmethod\n    def parse(cls, text: str) -> \"Version\":\n        parts = text.strip().removeprefix(\"v\").split(\".\")\n        if len(parts) != 3 or not all(p.isdigit() for p in parts):\n            raise ValueError(f\"invalid version: {text!r}\")\n        return cls(*(int(p) for p in parts))   # *(...) spreads into positional args\n\n    def __str__(self) -> str:\n        return f\"{self.major}.{self.minor}.{self.patch}\"", "hint": "<code>@dataclass(frozen=True, order=True)<\/code> does the comparisons for you. In <code>parse<\/code>, use <code>removeprefix(\"v\")<\/code>, <code>split(\".\")<\/code>, check you have three all-digit parts, then <code>cls(*(int(p) for p in parts))<\/code>."}, {"t": "h", "h": "Enums"}, {"t": "cmp", "go": "type Status int\n\nconst (\n\tPending Status = iota   // 0\n\tPaid                    // 1\n\tRefunded                // 2\n)\n// nothing stops Status(42) from existing", "py": "from enum import Enum, StrEnum, auto\n\nclass Status(Enum):\n    PENDING = auto()      # auto() picks the values for you\n    PAID = auto()\n    REFUNDED = auto()\n# Status(42) raises ValueError: only listed members exist\n\nclass Env(StrEnum):       # members ARE strings: Env.PROD == \"prod\"\n    DEV = \"dev\"           # handy for JSON, env vars, DB columns\n    PROD = \"prod\"", "note": null}, {"t": "tip", "kind": "prod", "h": "Rule of thumb: use <code>@dataclass<\/code> for internal domain objects and <code>pydantic.BaseModel<\/code> <b>at the edges<\/b> (HTTP bodies, config, queue messages, LLM output), where you parse untrusted data. Don't pass raw dicts beyond a function or two; that's Python's version of <code>map[string]interface{}<\/code>."}, {"t": "ex", "id": "ex-money", "title": "A Money value type", "prompt": "<p>Finish the frozen dataclass <code>Money(amount_cents: int, currency: str)<\/code>:<\/p><ul><li><code>__post_init__<\/code> rejects currencies that aren't exactly 3 uppercase letters (<code>ValueError<\/code>)<\/li><li><code>a + b<\/code> returns a new <code>Money<\/code>; mismatched currencies raise <code>ValueError<\/code><\/li><li><code>str(Money(1050, \"USD\"))<\/code> → <code>\"10.50 USD\"<\/code><\/li><\/ul>", "starter": "from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Money:\n    amount_cents: int\n    currency: str\n\n    # TODO: __post_init__, __add__, __str__", "tests": "a, b = Money(1050, \"USD\"), Money(250, \"USD\")\nassert a + b == Money(1300, \"USD\"), a + b\nassert str(a) == \"10.50 USD\", str(a)\n\ndef raises(fn, exc=ValueError):\n    try:\n        fn()\n    except exc:\n        return True\n    return False\n\nassert raises(lambda: a + Money(1, \"EUR\")), \"mismatched currency should raise ValueError\"\nassert raises(lambda: Money(1, \"usd\")), \"lowercase currency should raise ValueError\"\nassert raises(lambda: Money(1, \"US\")), \"2-letter currency should raise ValueError\"\nassert raises(lambda: setattr(a, \"amount_cents\", 0), Exception), \"Money should be frozen\"\nprint(\"all good\")", "solution": "from dataclasses import dataclass\n\n@dataclass(frozen=True)          # frozen: assigning a field raises, like an immutable value type\nclass Money:\n    amount_cents: int            # integer cents avoid float rounding errors\n    currency: str\n\n    def __post_init__(self) -> None:\n        # validate once at construction, so every Money in the system is valid\n        if not (len(self.currency) == 3 and self.currency.isalpha() and self.currency.isupper()):\n            raise ValueError(f\"bad currency: {self.currency!r}\")\n\n    def __add__(self, other: \"Money\") -> \"Money\":\n        # called for `a + b`; quotes around \"Money\" = forward reference to this class\n        if self.currency != other.currency:\n            raise ValueError(\"currency mismatch\")\n        # return a NEW object: frozen instances are never modified\n        return Money(self.amount_cents + other.amount_cents, self.currency)\n\n    def __str__(self) -> str:\n        # str(m) / print(m) use __str__; repr(m) still shows the dataclass form\n        return f\"{self.amount_cents / 100:.2f} {self.currency}\"", "hint": "<code>str.isalpha()<\/code> and <code>str.isupper()<\/code> help here. Format money with <code>f\"{x:.2f}\"<\/code>."}]}, {"id": "interfaces", "section": "Foundations", "title": "Interfaces → Protocols", "sub": "Structural typing, which you already know from Go.", "learn": ["typing.Protocol = Go interfaces", "Duck typing vs ABCs", "Inheritance vs embedding/composition"], "blocks": [{"t": "cmp", "go": "type Store interface {\n\tGet(key string) (string, error)\n}\n\ntype MemStore struct{ data map[string]string }\n\nfunc (m *MemStore) Get(k string) (string, error) {\n\t// ...\n}\n// MemStore satisfies Store implicitly", "py": "from typing import Protocol\n\nclass Store(Protocol):\n    def get(self, key: str) -> str: ...\n\nclass MemStore:                  # no inheritance needed\n    def __init__(self) -> None:\n        self.data: dict[str, str] = {}\n\n    def get(self, key: str) -> str:\n        return self.data[key]\n\ndef load(s: Store) -> str:       # mypy checks this structurally\n    return s.get(\"k\")", "note": null}, {"t": "p", "h": "Python gives you three options. <b>Duck typing<\/b> is the runtime default: if an object has <code>.get<\/code>, calling it works. <b><code>typing.Protocol<\/code><\/b> is structural and checked by mypy, which makes it the real equivalent of a Go interface. <b>ABCs<\/b> (<code>abc.ABC<\/code>) are nominal: a class must inherit to count, which is useful when you want enforced shared base behaviour."}, {"t": "run", "code": "from typing import Protocol, runtime_checkable\n\n@runtime_checkable          # allows isinstance() checks against the Protocol\nclass Closer(Protocol):     # like: type Closer interface { Close() }\n    def close(self) -> None: ...   # `...` = no body, just the method shape\n\nclass File:                 # note: does NOT inherit from Closer\n    def close(self) -> None:\n        print(\"file closed\")\n\nclass Conn:\n    def close(self) -> None:\n        print(\"conn closed\")\n\nclass Nope:                 # has no close() -> doesn't satisfy Closer\n    pass\n\nfor thing in [File(), Conn(), Nope()]:\n    # runtime check only looks at method NAMES, not signatures (mypy checks those)\n    ok = isinstance(thing, Closer)   # like v, ok := x.(Closer)\n    print(type(thing).__name__, ok)\n    if ok:\n        thing.close()", "title": null}, {"t": "h", "h": "Protocol, ABC, or nothing: which to use"}, {"t": "table", "head": ["Option", "What it is", "Use it when"], "rows": [["Duck typing (nothing)", "Just call the method; it works if the object has it", "Small scripts, or internal code where a type hint would add nothing"], ["<code>typing.Protocol<\/code>", "A structural interface checked by mypy; no inheritance needed (exactly like Go)", "Defining what a dependency must provide: repositories, clients, notifiers. <b>The default for production code.<\/b>"], ["<code>abc.ABC<\/code> + <code>@abstractmethod<\/code>", "A base class that subclasses must inherit from; instantiating one with missing methods fails at runtime", "You want shared implementation in the base class, or a plugin system where subclasses register themselves"]]}, {"t": "h", "h": "Embedding vs inheritance"}, {"t": "p", "h": "Go embedding promotes methods. In Python you either inherit (<code>class B(A)<\/code>) or delegate explicitly. Prefer composition and keep inheritance shallow; <code>super()<\/code> calls the parent's version."}, {"t": "run", "code": "class Logger:\n    def log(self, msg: str) -> None:\n        print(f\"[{type(self).__name__}] {msg}\")\n\nclass Service(Logger):               # like embedding Logger\n    def run(self) -> None:\n        self.log(\"starting\")\n\nclass CachedService(Service):\n    def run(self) -> None:\n        self.log(\"warming cache\")\n        super().run()                # the \"embedded\" behaviour\n\nCachedService().run()", "title": null}, {"t": "ex", "id": "ex-notifier", "title": "Pluggable notifiers", "prompt": "<p>Define a <code>Notifier<\/code> Protocol with <code>send(self, to: str, msg: str) -&gt; bool<\/code>. Then:<\/p><ul><li><code>EmailNotifier.send<\/code> returns <code>True<\/code> if <code>\"@\"<\/code> is in <code>to<\/code><\/li><li><code>SmsNotifier.send<\/code> returns <code>True<\/code> if <code>to<\/code> is all digits<\/li><li><code>broadcast(notifiers, to, msg)<\/code> returns the <b>class names<\/b> of notifiers that succeeded<\/li><\/ul><p>The implementations must <b>not<\/b> inherit from <code>Notifier<\/code>, because structural typing should be enough.<\/p>", "starter": "from typing import Protocol\n\nclass Notifier(Protocol):\n    # TODO: declare send(self, to: str, msg: str) -> bool with a `...` body\n    ...\n\nclass EmailNotifier:\n    # TODO: send() returns True when \"@\" is in `to`\n    ...\n\nclass SmsNotifier:\n    # TODO: send() returns True when `to` is all digits (str.isdigit)\n    ...\n\ndef broadcast(notifiers: list[Notifier], to: str, msg: str) -> list[str]:\n    # TODO: return class names of notifiers whose send() returned True\n    ...", "tests": "ns = [EmailNotifier(), SmsNotifier()]\nassert broadcast(ns, \"a@b.io\", \"hi\") == [\"EmailNotifier\"]\nassert broadcast(ns, \"5551234\", \"hi\") == [\"SmsNotifier\"]\nassert broadcast(ns, \"nobody\", \"hi\") == []\nassert EmailNotifier.__mro__[1] is object, \"no inheritance needed: structural typing!\"\nprint(\"all good\")", "solution": "from typing import Protocol\n\nclass Notifier(Protocol):\n    # the \"interface\": any class with a matching send() method satisfies it\n    def send(self, to: str, msg: str) -> bool: ...\n\nclass EmailNotifier:                     # no `(Notifier)`: structural typing\n    def send(self, to: str, msg: str) -> bool:\n        return \"@\" in to\n\nclass SmsNotifier:\n    def send(self, to: str, msg: str) -> bool:\n        return to.isdigit()              # True only if every char is 0-9\n\ndef broadcast(notifiers: list[Notifier], to: str, msg: str) -> list[str]:\n    # type(n).__name__ is the class name, e.g. \"EmailNotifier\"\n    return [type(n).__name__ for n in notifiers if n.send(to, msg)]", "hint": "<code>type(n).__name__<\/code> gives the class name. A list comprehension with an <code>if<\/code> makes <code>broadcast<\/code> a one-liner."}]}, {"id": "errors", "section": "Foundations", "title": "Errors → exceptions, defer → with", "sub": "No more if err != nil, but you still need discipline.", "learn": ["Exception hierarchies and wrapping with `from`", "try / except / else / finally", "Context managers as defer", "ExceptionGroup (errors.Join)"], "blocks": [{"t": "cmp", "go": "cfg, err := loadConfig(path)\nif err != nil {\n\treturn fmt.Errorf(\"startup: %w\", err)\n}", "py": "try:\n    cfg = load_config(path)\nexcept FileNotFoundError as e:\n    raise StartupError(\"startup failed\") from e", "note": null}, {"t": "p", "h": "Exceptions propagate up the stack on their own until something catches them, so the happy path has no <code>if err != nil<\/code>. The cost is that a function's signature doesn't tell you what can fail. So <b>catch narrowly, at boundaries where you can act<\/b> (retry, translate to a 4xx, fall back), and let everything else bubble up to one top-level handler that logs it."}, {"t": "run", "code": "class AppError(Exception):\n    \"\"\"Base for all our errors, like a sentinel family.\"\"\"\n\nclass NotFound(AppError):\n    def __init__(self, kind: str, id: int):\n        super().__init__(f\"{kind} {id} not found\")\n        self.kind, self.id = kind, id\n\ndef get_user(uid: int) -> dict:\n    db = {1: {\"name\": \"ana\"}}\n    try:\n        return db[uid]\n    except KeyError as e:\n        raise NotFound(\"user\", uid) from e   # like fmt.Errorf(\"...: %w\", err)\n\nfor uid in (1, 2):\n    try:\n        user = get_user(uid)\n    except NotFound as e:                    # like errors.As(err, &nf)\n        print(\"404:\", e, \"| cause:\", repr(e.__cause__))\n    except AppError:\n        print(\"generic app error\")\n    else:\n        print(\"found\", user)                 # only if nothing was raised\n    finally:\n        print(\"cleanup for\", uid)            # always runs", "title": "custom exceptions"}, {"t": "tip", "kind": "warn", "h": "Never write bare <code>except:<\/code> or <code>except Exception: pass<\/code>. They swallow bugs, and a bare <code>except:<\/code> even catches Ctrl-C. If you must catch broadly at a top-level boundary, log with <code>logger.exception(...)<\/code> so the traceback is kept."}, {"t": "h", "h": "Which exception should I raise?"}, {"t": "p", "h": "Prefer built-in exceptions when they describe the problem exactly, and define your own (subclassing one base <code>AppError<\/code>) for domain failures that callers need to catch specifically."}, {"t": "table", "head": ["Exception", "Means", "Example"], "rows": [["<code>ValueError<\/code>", "Right type, bad value", "<code>int(\"abc\")<\/code>, a negative quantity, a malformed email"], ["<code>TypeError<\/code>", "Wrong type entirely", "Passing a list where a str is required"], ["<code>KeyError<\/code> / <code>IndexError<\/code>", "Missing key / position out of range", "<code>d[\"nope\"]<\/code>, <code>xs[99]<\/code>. Both are subclasses of <code>LookupError<\/code>"], ["<code>FileNotFoundError<\/code>, <code>PermissionError<\/code>", "OS-level failures (subclasses of <code>OSError<\/code>)", "Opening a missing file"], ["<code>TimeoutError<\/code>, <code>ConnectionError<\/code>", "Network trouble: usually worth retrying", "An upstream API timing out"], ["<code>NotImplementedError<\/code>", "Not written yet / must be overridden", "A placeholder method"], ["<code>RuntimeError<\/code>", "Something went wrong that fits nothing else", "Use sparingly; a custom exception is usually clearer"], ["Your own <code>NotFound(AppError)<\/code>, <code>Conflict(AppError)<\/code>…", "Domain outcomes callers handle specifically", "Mapping to HTTP 404 / 409 at the API boundary"]]}, {"t": "h", "h": "EAFP: why Python code tries first and checks later"}, {"t": "p", "h": "Go code checks before acting. Idiomatic Python often does the reverse: <b>EAFP<\/b>, &ldquo;easier to ask forgiveness than permission&rdquo;. Try the operation and handle the exception. It avoids race conditions (a file can disappear between an <code>exists()<\/code> check and <code>open()<\/code>), does one lookup instead of two, and covers failure cases you didn't think to check. The opposite style, LBYL (&ldquo;look before you leap&rdquo;), is still right when failure is common and cheap to detect, or when the check reads more clearly."}, {"t": "run", "code": "config = {\"port\": \"80a80\"}\n\n# LBYL (look before you leap): the Go habit, check everything first\nif \"port\" in config and config[\"port\"].isdigit():\n    port = int(config[\"port\"])\nelse:\n    port = 8000\n\n# EAFP: just do it, and handle the specific failures\ntry:\n    port = int(config[\"port\"])\nexcept (KeyError, ValueError):    # missing key OR not a number\n    port = 8000\nprint(port)", "title": null}, {"t": "h", "h": "defer → with"}, {"t": "cmp", "go": "f, err := os.Open(path)\nif err != nil {\n\treturn err\n}\ndefer f.Close()       // runs when the FUNCTION returns\n\nmu.Lock()\ndefer mu.Unlock()", "py": "with open(path) as f:    # closed on exit, even on exception\n    data = f.read()\n\nwith lock:               # threading.Lock / asyncio.Lock\n    counter += 1", "note": null}, {"t": "run", "code": "import time\nfrom contextlib import contextmanager, ExitStack\n\n# @contextmanager turns a generator into something usable with `with`.\n# Code before `yield` = setup, code after = teardown (the defer part).\n@contextmanager\ndef timed(label: str):\n    start = time.perf_counter()        # monotonic, high-resolution clock\n    try:\n        yield                          # the body of the `with` block runs here\n    finally:                           # runs even if the body raised: like defer\n        print(f\"{label}: {(time.perf_counter() - start) * 1000:.1f}ms\")\n\n@contextmanager\ndef resource(name: str):\n    print(\"open\", name)\n    try:\n        yield name.upper()             # the yielded value becomes `as x` in the with\n    finally:\n        print(\"close\", name)\n\nwith timed(\"work\"):\n    sum(range(200_000))                # underscores in numbers are just for readability\n\n# ExitStack: register a variable number of context managers; they are closed\n# in reverse (LIFO) order, exactly like multiple defers in one Go function\nwith ExitStack() as stack:\n    handles = [stack.enter_context(resource(n)) for n in [\"a\", \"b\", \"c\"]]\n    print(\"using\", handles)", "title": "write your own context managers"}, {"t": "tip", "kind": "go", "h": "You'll see this <b>yield-shaped setup/teardown<\/b> pattern all over Python: <code>@contextmanager<\/code>, pytest fixtures, FastAPI <code>lifespan<\/code>, and FastAPI dependencies that <code>yield<\/code> a DB session. Everything before <code>yield<\/code> is setup; everything after it is cleanup, your <code>defer<\/code>. It works because <code>yield<\/code> pauses a function and resumes it later (see the next module)."}, {"t": "h", "h": "Several errors at once"}, {"t": "run", "code": "# Like errors.Join. TaskGroup raises these for you (see Concurrency).\ndef validate(payload: dict) -> None:\n    errs = []                                   # collect every problem, not just the first\n    if \"email\" not in payload:\n        errs.append(ValueError(\"email required\"))\n    if payload.get(\"age\", 0) < 0:\n        errs.append(ValueError(\"age must be >= 0\"))\n    if errs:\n        # ExceptionGroup(message, [exceptions]) bundles them into one raise\n        raise ExceptionGroup(\"invalid payload\", errs)\n\ntry:\n    validate({\"age\": -1})\nexcept* ValueError as eg:          # except* matches exceptions INSIDE a group\n    for e in eg.exceptions:        # eg is a (sub)group of just the ValueErrors\n        print(\"-\", e)", "title": null}, {"t": "ex", "id": "ex-load-port", "title": "Config loading with proper errors", "prompt": "<p>Write <code>load_port(env)<\/code>, which reads <code>env[\"PORT\"]<\/code>:<\/p><ul><li>Missing: return <code>8080<\/code><\/li><li>Not an integer: raise <code>ConfigError<\/code>, <b>chained<\/b> from the original <code>ValueError<\/code><\/li><li>Outside 1–65535: raise <code>ConfigError<\/code><\/li><\/ul>", "starter": "class ConfigError(Exception):\n    pass\n\ndef load_port(env: dict[str, str]) -> int:\n    ...", "tests": "assert load_port({}) == 8080\nassert load_port({\"PORT\": \"9000\"}) == 9000\ntry:\n    load_port({\"PORT\": \"abc\"})\nexcept ConfigError as e:\n    assert isinstance(e.__cause__, ValueError), \"chain it: raise ConfigError(...) from e\"\nelse:\n    raise AssertionError(\"expected ConfigError for 'abc'\")\ntry:\n    load_port({\"PORT\": \"70000\"})\nexcept ConfigError:\n    pass\nelse:\n    raise AssertionError(\"expected ConfigError for 70000\")\nprint(\"all good\")", "solution": "class ConfigError(Exception):          # your own error type (like a sentinel family)\n    pass\n\ndef load_port(env: dict[str, str]) -> int:\n    raw = env.get(\"PORT\")              # None when missing, no KeyError\n    if raw is None:\n        return 8080                    # sensible default\n    try:\n        port = int(raw)                # int(\"abc\") raises ValueError\n    except ValueError as e:\n        # `from e` keeps the original error as __cause__ (like %w in fmt.Errorf),\n        # so the traceback shows both: what failed and why\n        raise ConfigError(f\"PORT must be an integer, got {raw!r}\") from e\n    if not 1 <= port <= 65535:         # chained comparison: 1 <= port and port <= 65535\n        raise ConfigError(f\"PORT out of range: {port}\")\n    return port", "hint": "<code>int(\"abc\")<\/code> raises <code>ValueError<\/code>. Python allows chained comparisons: <code>1 &lt;= port &lt;= 65535<\/code>."}]}, {"id": "generators", "section": "Foundations", "title": "Generators & decorators", "sub": "Lazy pipelines without channels, and middleware for any function.", "learn": ["yield-based iterators vs channel pipelines", "itertools essentials", "Decorators as middleware", "Decorator factories with arguments"], "blocks": [{"t": "h", "h": "How a for-loop really works: the iterator protocol"}, {"t": "p", "h": "<code>for x in obj<\/code> first calls <code>iter(obj)<\/code> to get an iterator, then calls <code>next()<\/code> on it until it raises <code>StopIteration<\/code>. Lists, dicts, files, DB cursors and generators all speak this protocol. A <b>generator function<\/b> is the easy way to write one: each <code>yield<\/code> hands out a value and <b>pauses the function, keeping its local variables<\/b>, until the next <code>next()<\/code> resumes it. That pause-and-resume mechanism is also what powers <code>async<\/code>/<code>await<\/code> and <code>@contextmanager<\/code>."}, {"t": "run", "code": "xs = [10, 20]\nit = iter(xs)              # what `for` does first\nprint(next(it), next(it))  # what `for` does each iteration\ntry:\n    next(it)\nexcept StopIteration:\n    print(\"StopIteration: this is how a for-loop knows to stop\")\n\ndef countdown(n):\n    print(\"  (body starts on the first next())\")\n    while n > 0:\n        yield n            # hand out n and PAUSE here, keeping n\n        n -= 1             # resumes from this line on the next next()\n    print(\"  (body finished → StopIteration)\")\n\ngen = countdown(2)         # nothing runs yet, just like calling an async def\nprint(type(gen).__name__)\nprint(next(gen))\nprint(next(gen))\nprint(list(gen))           # drains the rest", "title": "iter / next / yield"}, {"t": "table", "head": ["Term", "What it is", "Example"], "rows": [["<b>Iterable<\/b>", "Anything you can loop over with <code>for<\/code> (it has <code>__iter__<\/code>)", "list, tuple, dict, set, str, file, range"], ["<b>Iterator<\/b>", "The cursor that produces items one at a time via <code>next()<\/code>; gets used up", "<code>iter([1, 2])<\/code>, a file object"], ["<b>Generator<\/b>", "An iterator written as a function with <code>yield<\/code>, or as <code>(x for x in …)<\/code>", "<code>def read_lines(): yield …<\/code>"], ["<b>list<\/b>", "A fully built, in-memory sequence you can index and loop over many times", "<code>[1, 2, 3]<\/code>"]]}, {"t": "p", "h": "<b>Why generators instead of lists?<\/b> Memory: a generator over a 10 GB log file holds one line at a time. Laziness: you can stop early (<code>break<\/code>, <code>islice<\/code>) without computing the rest. Composition: small stages chain into a pipeline. Use a list when you need <code>len()<\/code>, indexing, or to iterate more than once, because generators are <b>single-use<\/b>:"}, {"t": "run", "code": "squares = (n * n for n in range(4))\nprint(sum(squares))   # 14\nprint(sum(squares))   # 0: already exhausted! Use a list if you need two passes.", "title": null}, {"t": "h", "h": "Generators vs channels"}, {"t": "cmp", "go": "func readLines(r io.Reader) <-chan string {\n\tch := make(chan string)\n\tgo func() {                 // producer goroutine\n\t\tdefer close(ch)         // consumer's range ends on close\n\t\ts := bufio.NewScanner(r)\n\t\tfor s.Scan() {\n\t\t\tch <- s.Text()      // blocks until the consumer reads\n\t\t}\n\t}()\n\treturn ch\n}", "py": "def read_lines(f):\n    for line in f:          # lazy: one line at a time\n        yield line.rstrip(\"\\n\")\n\n# no goroutine, no channel:\n# the caller pulls values on demand", "note": null}, {"t": "run", "code": "from itertools import islice, batched   # batched: Python 3.12+\n\ndef numbers():\n    n = 0\n    while True:            # infinite, but lazy\n        yield n\n        n += 1\n\ndef only_even(xs):\n    for x in xs:\n        if x % 2 == 0:\n            yield x\n\ndef squared(xs):\n    return (x * x for x in xs)    # generator expression\n\npipeline = squared(only_even(numbers()))\nprint(list(islice(pipeline, 5)))\n\nfor batch in batched(range(7), 3):     # bulk DB inserts / API calls\n    print(batch)", "title": "lazy pipelines"}, {"t": "h", "h": "Decorators = middleware"}, {"t": "cmp", "go": "// middleware: takes a handler, returns a wrapped handler\nfunc Logging(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tlog.Println(r.URL.Path)      // before\n\t\tnext.ServeHTTP(w, r)         // call the wrapped handler\n\t})\n}", "py": "import functools\n\ndef logging_mw(fn):                  # takes a function...\n    @functools.wraps(fn)             # copy fn's name/docstring onto wrapper\n    def wrapper(*args, **kwargs):    # accept ANY arguments\n        print(\"calling\", fn.__name__)    # before\n        return fn(*args, **kwargs)       # call the wrapped function\n    return wrapper                   # ...returns a new function\n\n@logging_mw        # same as: handler = logging_mw(handler)\ndef handler(req): ...", "note": null}, {"t": "run", "code": "import functools, time\n\ndef timed(fn):\n    @functools.wraps(fn)                 # keeps __name__/docstring (logs, debuggers, FastAPI need them)\n    def wrapper(*args, **kwargs):        # forwards any arguments unchanged\n        t = time.perf_counter()\n        try:\n            return fn(*args, **kwargs)\n        finally:                         # report timing even if fn raised\n            print(f\"{fn.__name__} took {(time.perf_counter() - t) * 1e3:.2f}ms\")\n    return wrapper\n\n# lru_cache memoises results by arguments: repeat calls are dict lookups.\n# Arguments must be hashable. maxsize=None means unbounded (fine for this demo).\n@functools.lru_cache(maxsize=None)\ndef fib(n: int) -> int:\n    return n if n < 2 else fib(n - 1) + fib(n - 2)   # exponential without the cache\n\n@timed                                   # decorators stack: compute = timed(compute)\ndef compute():\n    return fib(80)\n\nprint(compute(), fib.cache_info())       # hits/misses show the cache working", "title": null}, {"t": "ex", "id": "ex-retry", "title": "Build a retry decorator", "prompt": "<p>Write <code>retry(times, exceptions=(Exception,))<\/code>, a decorator <b>factory<\/b>:<\/p><ul><li>Call the wrapped function up to <code>times<\/code> attempts in total<\/li><li>Retry only on the listed exception types; anything else propagates immediately<\/li><li>When attempts run out, re-raise the last error<\/li><li>Preserve <code>__name__<\/code> with <code>functools.wraps<\/code><\/li><\/ul>", "starter": "import functools\n\ndef retry(times: int, exceptions=(Exception,)):\n    # return a decorator, which returns a wrapper...\n    ...", "tests": "calls = {\"n\": 0}\n\n@retry(3, exceptions=(ConnectionError,))\ndef flaky():\n    calls[\"n\"] += 1\n    if calls[\"n\"] < 3:\n        raise ConnectionError(\"blip\")\n    return \"ok\"\n\nassert flaky() == \"ok\" and calls[\"n\"] == 3, calls\nassert flaky.__name__ == \"flaky\", \"use functools.wraps\"\n\ncalls[\"n\"] = 0\n@retry(2, exceptions=(ConnectionError,))\ndef always_down():\n    calls[\"n\"] += 1\n    raise ConnectionError(\"down\")\ntry:\n    always_down()\nexcept ConnectionError:\n    assert calls[\"n\"] == 2, f\"expected 2 attempts, got {calls['n']}\"\nelse:\n    raise AssertionError(\"should re-raise after the last attempt\")\n\ncalls[\"n\"] = 0\n@retry(5, exceptions=(ConnectionError,))\ndef bad_input():\n    calls[\"n\"] += 1\n    raise ValueError(\"not retryable\")\ntry:\n    bad_input()\nexcept ValueError:\n    assert calls[\"n\"] == 1, \"don't retry exceptions that aren't listed\"\nprint(\"all good\")", "solution": "import functools\n\ndef retry(times: int, exceptions=(Exception,)):\n    # Layer 1: called with the CONFIG -> @retry(3, ...) runs this first\n    def decorator(fn):\n        # Layer 2: called with the FUNCTION being decorated\n        @functools.wraps(fn)                 # keep fn.__name__ etc.\n        def wrapper(*args, **kwargs):\n            # Layer 3: runs on every call of the decorated function\n            for attempt in range(1, times + 1):\n                try:\n                    return fn(*args, **kwargs)   # success -> return immediately\n                except exceptions:               # a tuple of types is allowed here\n                    if attempt == times:\n                        raise                    # bare raise: re-raise the current error\n                    # otherwise loop and try again (real code: sleep with backoff + jitter)\n            # exceptions NOT in the tuple are never caught -> propagate on the first try\n        return wrapper\n    return decorator", "hint": "Three nested functions: <code>retry(times)<\/code> returns <code>decorator(fn)<\/code>, which returns <code>wrapper(*args, **kwargs)<\/code>. <code>except exceptions:<\/code> accepts a tuple, and a bare <code>raise<\/code> re-raises the current exception."}, {"t": "tip", "kind": "prod", "h": "In real code, use <b>tenacity<\/b> for retries (exponential backoff, jitter, stop conditions, async support). Writing one yourself once is still the best way to understand decorators."}]}, {"id": "typing", "section": "Production", "title": "Type hints, mypy & pydantic", "sub": "Getting back compile-time safety, and adding runtime validation.", "learn": ["Hints aren't enforced at runtime", "Modern typing: generics, Literal, TypedDict, NewType", "mypy --strict config", "pydantic for untrusted data (including LLM output)"], "blocks": [{"t": "p", "h": "Type hints are <b>ignored at runtime<\/b>. They exist for mypy or pyright (in CI) and for your editor. In production code, annotate everything at module boundaries and run <code>mypy --strict<\/code> on every PR."}, {"t": "run", "code": "def add(a: int, b: int) -> int:\n    return a + b\n\nprint(add(\"not \", \"checked\"))   # runs fine! hints aren't enforced\nprint(add.__annotations__)", "title": null}, {"t": "h", "h": "Type hint cheat sheet"}, {"t": "table", "head": ["You mean", "Write", "Go equivalent"], "rows": [["A list of ints", "<code>list[int]<\/code>", "<code>[]int<\/code>"], ["A map from str to float", "<code>dict[str, float]<\/code>", "<code>map[string]float64<\/code>"], ["A fixed pair", "<code>tuple[str, int]<\/code>", "a small struct / two return values"], ["A tuple of any length", "<code>tuple[int, ...]<\/code>", "<code>[]int<\/code> (read-only)"], ["A set of strings", "<code>set[str]<\/code>", "<code>map[string]struct{}<\/code>"], ["Maybe missing", "<code>str | None<\/code>", "<code>*string<\/code>"], ["One of several types", "<code>int | str<\/code>", "an interface / type switch"], ["One of fixed values", "<code>Literal[\"asc\", \"desc\"]<\/code>", "typed constants"], ["Anything you can loop over (accept this in params)", "<code>Iterable[int]<\/code>", "a range-able interface"], ["Read-only mapping (accept this in params)", "<code>Mapping[str, int]<\/code>", "n/a"], ["A function taking an int, returning a str", "<code>Callable[[int], str]<\/code>", "<code>func(int) string<\/code>"], ["An async function's return", "<code>async def f() -&gt; int<\/code> (awaiting gives an int)", "n/a"], ["Anything, checking turned off", "<code>Any<\/code> (avoid)", "<code>any<\/code> without type assertions"]]}, {"t": "code", "code": "from typing import Any, Literal, NewType, TypedDict\nfrom collections.abc import Callable, Iterable, Mapping\n\nUserId = NewType(\"UserId\", int)          # like `type UserId int`\n\nclass Event(TypedDict):                  # typed shape for dicts / JSON\n    type: Literal[\"click\", \"view\"]\n    user: UserId\n    meta: dict[str, Any]\n\ndef first[T](xs: Iterable[T]) -> T | None:   # generics (3.12 syntax)\n    for x in xs:\n        return x\n    return None\n\ntype Handler = Callable[[Event], None]       # type alias (3.12)\n\ndef dispatch(events: Iterable[Event], handlers: Mapping[str, Handler]) -> None:\n    for e in events:\n        handlers[e[\"type\"]](e)", "lang": "python", "title": "modern typing toolkit"}, {"t": "tip", "kind": "go", "h": "Rough mapping: <code>*T<\/code> or nil becomes <code>T | None<\/code>; <code>[T any]<\/code> becomes <code>[T]<\/code>; <code>interface{}<\/code>/<code>any<\/code> becomes <code>object<\/code> (safe) or <code>Any<\/code> (turns checking off, so avoid it). Accept abstract types (<code>Iterable<\/code>, <code>Mapping<\/code>) and return concrete ones (<code>list<\/code>, <code>dict<\/code>), the same as accepting interfaces and returning structs."}, {"t": "code", "code": "[tool.mypy]\nstrict = true                 # turns on all the optional strictness flags\npython_version = \"3.12\"       # check against this language version\nwarn_unreachable = true       # flag dead code after impossible branches\n\n# third-party libs without type hints: don't fail the build on them\n[[tool.mypy.overrides]]\nmodule = [\"some_untyped_lib.*\"]\nignore_missing_imports = true", "lang": "ini", "title": "pyproject.toml"}, {"t": "h", "h": "pydantic: validation at the edges"}, {"t": "p", "h": "Static hints can't protect you from a bad JSON body, a malformed env var, or an LLM that invents a field. pydantic parses, coerces, and validates at runtime, and gives you precise errors. (The runner below installs it on first use.)"}, {"t": "run", "code": "from typing import Literal\nfrom pydantic import BaseModel, Field, ValidationError\n\nclass CreateOrder(BaseModel):                    # like a Go struct + validator tags\n    sku: str = Field(min_length=3)               # constraints live next to the field\n    qty: int = Field(gt=0, le=100)               # gt = greater than, le = less or equal\n    priority: Literal[\"low\", \"high\"] = \"low\"     # only these exact values allowed\n    tags: list[str] = []                         # pydantic copies defaults: safe here\n\n# Lax mode (default) coerces \"2\" -> 2, then validates constraints\no = CreateOrder.model_validate({\"sku\": \"ABC-1\", \"qty\": \"2\"})\nprint(o)\nprint(o.model_dump_json())                       # serialise back to JSON\n\ntry:\n    CreateOrder.model_validate({\"sku\": \"x\", \"qty\": 0, \"priority\": \"urgent\"})\nexcept ValidationError as e:\n    # ALL errors are reported at once, each with a location path and message:\n    # perfect for 422 responses or for feeding back to an LLM to self-correct\n    print(e.error_count(), \"errors\")\n    for err in e.errors():\n        print(\" \", err[\"loc\"], err[\"msg\"])", "title": "pydantic"}, {"t": "tip", "kind": "prod", "h": "<b>For agents:<\/b> this is also how you get reliable structured output from LLMs. Define a <code>BaseModel<\/code>, send <code>Model.model_json_schema()<\/code> as the tool or response schema, and validate the reply with <code>Model.model_validate_json(text)<\/code>. If validation fails, feed the error back to the model and retry."}, {"t": "ex", "id": "ex-toolcall", "title": "Validate an LLM tool call", "prompt": "<p>Define a pydantic model <code>ToolCall<\/code> with:<\/p><ul><li><code>name: str<\/code>, which must match <code>^[a-z_]+$<\/code> (use <code>Field(pattern=...)<\/code>)<\/li><li><code>args: dict[str, Any]<\/code>, defaulting to <code>{}<\/code><\/li><\/ul><p>Then write <code>parse_tool_call(raw: str)<\/code> that returns a <code>ToolCall<\/code>, or <code>None<\/code> if the JSON is invalid or fails validation.<\/p>", "starter": "from typing import Any\nfrom pydantic import BaseModel, Field, ValidationError\n\nclass ToolCall(BaseModel):\n    # TODO: name: str with Field(pattern=...)  (regex: lowercase letters/underscore)\n    # TODO: args: dict[str, Any] defaulting to {}\n    ...\n\ndef parse_tool_call(raw: str) -> \"ToolCall | None\":\n    # TODO: parse + validate raw JSON; return None on ValidationError\n    ...", "tests": "tc = parse_tool_call('{\"name\": \"get_weather\", \"args\": {\"city\": \"Paris\"}}')\nassert tc is not None and tc.name == \"get_weather\" and tc.args == {\"city\": \"Paris\"}, tc\nassert parse_tool_call('{\"name\": \"search\"}').args == {}\nassert parse_tool_call('{\"name\": \"Bad-Name\"}') is None, \"name must match ^[a-z_]+$\"\nassert parse_tool_call('not json') is None\nassert parse_tool_call('{\"args\": {}}') is None, \"name is required\"\nprint(\"all good\")", "solution": "from typing import Any\nfrom pydantic import BaseModel, Field, ValidationError\n\nclass ToolCall(BaseModel):\n    # r\"...\" raw string so the regex backslashes aren't Python escapes\n    name: str = Field(pattern=r\"^[a-z_]+$\")   # reject names the model hallucinated\n    args: dict[str, Any] = {}                 # missing args -> empty dict\n\ndef parse_tool_call(raw: str) -> \"ToolCall | None\":\n    try:\n        # one step: JSON parse + type checks + constraints\n        return ToolCall.model_validate_json(raw)\n    except ValidationError:\n        # covers invalid JSON, missing name, and pattern mismatches alike.\n        # In an agent you'd send e.errors() back to the model and ask it to retry.\n        return None", "hint": "<code>model_validate_json<\/code> parses and validates in one step, and raises <code>ValidationError<\/code> for bad JSON too."}]}, {"id": "concurrency", "section": "Production", "title": "Concurrency: asyncio vs goroutines", "sub": "The area where Go intuition helps most and misleads most.", "learn": ["Why Python needs async/await, and what await actually does", "Forgetting await and blocking the loop", "The GIL and choosing async, threads, or processes", "gather, TaskGroup (errgroup), timeouts, cancellation", "Worker pools with Queue, bounded concurrency with Semaphore"], "blocks": [{"t": "h", "h": "Why async? Why await?"}, {"t": "p", "h": "Most backend time is spent <b>waiting<\/b>: on Postgres, on an HTTP API, on an LLM that takes five seconds to answer. Go hides this. When a goroutine blocks on I/O, the runtime parks it and runs another one, so you write ordinary blocking code and get concurrency for free. Python can't do that with plain functions: OS threads are relatively heavy, and the GIL lets only one of them run Python at a time. asyncio's answer is to run thousands of tasks on <b>one thread<\/b> and switch between them only at points the code marks explicitly. That mark is <code>await<\/code>."}, {"t": "table", "head": ["Python", "What it means", "Closest Go idea"], "rows": [["<code>async def f()<\/code>", "Defines a coroutine function. Calling <code>f()<\/code> does <b>not<\/b> run the body; it returns a paused coroutine object.", "A function you plan to run with <code>go<\/code>, not started yet"], ["<code>await f()<\/code>", "Run it now and suspend <i>this<\/i> task until it finishes. While this task waits, the event loop runs other tasks. The expression's value is <code>f<\/code>'s return value.", "A blocking call, <code>res := f()<\/code>, where the runtime parks the goroutine"], ["<code>asyncio.create_task(f())<\/code>", "Start it concurrently and keep going. Await the returned Task later to get the result.", "<code>go f()<\/code> plus a channel for the result"], ["<code>asyncio.gather(a(), b())<\/code>", "Run several concurrently, wait for all of them, and return the results in order.", "<code>errgroup<\/code> / <code>WaitGroup<\/code>"], ["<code>asyncio.run(main())<\/code>", "Create the event loop and run <code>main()<\/code> to completion.", "The runtime starting <code>main<\/code>"]]}, {"t": "tip", "kind": "go", "h": "The core difference: in Go any call might block, and the runtime deals with it invisibly. In Python, every point where your task can pause is written out as <code>await<\/code>. It's more typing, but you can see exactly where other tasks might run, which is also where shared state could change under you."}, {"t": "run", "code": "import asyncio, time\n\nasync def fetch(name: str, seconds: float) -> str:\n    print(f\"  {name}: sending request\")\n    await asyncio.sleep(seconds)    # simulated network wait: THIS task pauses, the loop runs others\n    print(f\"  {name}: got response\")\n    return name\n\n# 1) awaiting one after another is sequential, like calling blocking funcs in a row\nt = time.perf_counter()\nawait fetch(\"db\", 0.3)\nawait fetch(\"api\", 0.3)\nprint(f\"sequential: {time.perf_counter() - t:.1f}s\\n\")\n\n# 2) gather starts both, THEN waits, so the two waits overlap\nt = time.perf_counter()\nawait asyncio.gather(fetch(\"db\", 0.3), fetch(\"api\", 0.3))\nprint(f\"concurrent: {time.perf_counter() - t:.1f}s\")", "title": "await alone vs concurrency"}, {"t": "p", "h": "A common misconception: <code>await<\/code> on its own doesn't make code concurrent. Two awaits in a row still run one after the other. What <code>await<\/code> buys you is that <i>while<\/i> this task waits, <b>other tasks<\/b> can run. In a FastAPI server those other tasks are the other requests in flight, so one slow database call doesn't stall everyone. For concurrency <i>within<\/i> one request you start several tasks yourself with <code>gather<\/code>, <code>create_task<\/code> or a <code>TaskGroup<\/code>."}, {"t": "run", "code": "import asyncio, time\n\nasync def get_user() -> dict:\n    await asyncio.sleep(0.1)\n    return {\"name\": \"ana\"}\n\n# Mistake 1: forgetting await. You get a coroutine object, not the result.\nuser = get_user()\nprint(type(user).__name__, \"->\", user)\nuser.close()                        # tidy up (otherwise Python warns \"was never awaited\")\nprint(\"with await:\", (await get_user())[\"name\"])\n\n# Mistake 2: blocking inside async. time.sleep never yields, so nothing else can run.\nasync def ticker():\n    for i in range(3):\n        print(\"  tick\", i)\n        await asyncio.sleep(0.1)\n\nasync def bad_handler():\n    time.sleep(0.35)                # blocks the WHOLE event loop (like a sync DB driver would)\n    print(\"  bad_handler done\")\n\nasync def good_handler():\n    await asyncio.sleep(0.35)       # yields, so the ticker keeps ticking\n    print(\"  good_handler done\")\n\nprint(\"blocking call:\")\nawait asyncio.gather(ticker(), bad_handler())\nprint(\"awaited call:\")\nawait asyncio.gather(ticker(), good_handler())", "title": "the two classic mistakes"}, {"t": "h", "h": "The “function colour” rule"}, {"t": "p", "h": "Async functions can call plain functions normally, but plain functions <b>cannot<\/b> use <code>await<\/code>. So async spreads upward: if a handler awaits the database, the handler must be <code>async def<\/code>, and so must anything that awaits it, all the way up to <code>asyncio.run()<\/code> or the server that runs the event loop. Go has no such split, and it's the biggest ergonomic difference between the two."}, {"t": "code", "code": "def double(x: int) -> int:             # plain function: callable from anywhere\n    return x * 2\n\nasync def load(user_id: int) -> dict:\n    row = await db.fetch_one(user_id)  # it awaits, so it must be async def\n    return {\"id\": user_id, \"score\": double(row.score)}   # async CAN call sync\n\ndef report(user_id: int) -> dict:\n    data = await load(user_id)         # ❌ SyntaxError: 'await' outside async function\n    data = asyncio.run(load(user_id))  # ✅ but only at the top of a sync program,\n    return data                        #    never inside an already-running loop", "lang": "python", "title": "async calls sync, but not the reverse"}, {"t": "table", "head": ["Situation", "Use"], "rows": [["API or agent doing lots of network I/O (DB, HTTP, LLM calls)", "<code>async def<\/code> with async libraries (httpx, asyncpg, PyMongo async)"], ["Calling many APIs or tools at once", "async plus <code>gather<\/code> / <code>TaskGroup<\/code>"], ["CPU-heavy work (parsing, image processing, local embeddings)", "Plain <code>def<\/code> in a process pool; async doesn't help here"], ["A script or CLI that does one thing at a time", "Plain <code>def<\/code>: simpler, and nothing to overlap"], ["Only a blocking library exists", "Plain <code>def<\/code> handler (FastAPI runs it in a threadpool) or <code>await asyncio.to_thread(fn)<\/code>"]]}, {"t": "tip", "kind": "prod", "h": "In FastAPI you choose per handler: <code>async def<\/code> when everything inside is awaited, plain <code>def<\/code> when it calls blocking libraries. The one choice to avoid is <code>async def<\/code> with a blocking call inside, which stalls every request on that worker."}, {"t": "ex", "id": "ex-dashboard", "title": "Make a slow endpoint concurrent", "prompt": "<p><code>load_dashboard<\/code> works, but takes about 0.3s because each <code>await<\/code> finishes before the next call starts. Change it so the three independent calls run <b>concurrently<\/b> (about 0.1s total) and return the same dict.<\/p>", "starter": "import asyncio\n\nasync def get_profile(uid): await asyncio.sleep(0.1); return {\"name\": \"ana\"}\nasync def get_orders(uid):  await asyncio.sleep(0.1); return [1, 2]\nasync def get_alerts(uid):  await asyncio.sleep(0.1); return []\n\nasync def load_dashboard(uid: int) -> dict:\n    # Correct but slow (~0.3s): each await waits before the next call starts.\n    # TODO: run the three calls concurrently so this takes ~0.1s\n    profile = await get_profile(uid)\n    orders = await get_orders(uid)\n    alerts = await get_alerts(uid)\n    return {\"profile\": profile, \"orders\": orders, \"alerts\": alerts}", "tests": "import time\nt = time.perf_counter()\nout = await load_dashboard(1)\nelapsed = time.perf_counter() - t\nassert out == {\"profile\": {\"name\": \"ana\"}, \"orders\": [1, 2], \"alerts\": []}, out\nassert elapsed < 0.2, f\"took {elapsed:.2f}s: the calls are still running one after another\"\nprint(f\"all good in {elapsed:.2f}s\")", "solution": "import asyncio\n\nasync def get_profile(uid): await asyncio.sleep(0.1); return {\"name\": \"ana\"}\nasync def get_orders(uid):  await asyncio.sleep(0.1); return [1, 2]\nasync def get_alerts(uid):  await asyncio.sleep(0.1); return []\n\nasync def load_dashboard(uid: int) -> dict:\n    # gather starts all three coroutines, then waits for all of them.\n    # Results come back in argument order, so tuple-unpacking is safe.\n    profile, orders, alerts = await asyncio.gather(\n        get_profile(uid),\n        get_orders(uid),\n        get_alerts(uid),\n    )\n    return {\"profile\": profile, \"orders\": orders, \"alerts\": alerts}", "hint": "Pass all three calls to <code>asyncio.gather(...)<\/code> and <code>await<\/code> it once. It returns a list in the same order, so you can unpack it straight into three names."}, {"t": "h", "h": "Choosing between async, threads and processes"}, {"t": "p", "h": "CPython has a <b>Global Interpreter Lock<\/b>: only one thread executes Python bytecode at a time. (Free-threaded builds exist but are still opt-in.) That makes the right tool depend on the workload:"}, {"t": "tip", "kind": "go", "h": "<b>Why does the GIL exist?<\/b> CPython manages memory with reference counting, and updating those counts from many threads at once isn't thread-safe. One global lock was the simple fix, and it keeps single-threaded code and C extensions fast. The cost is that threads don't run Python code in parallel. Since 3.13 there's an optional free-threaded build without the GIL, but most production code still assumes it: async for I/O, processes for CPU."}, {"t": "table", "head": ["Workload", "Go", "Python"], "rows": [["I/O-bound: HTTP, DB, LLM APIs", "goroutines", "<b>asyncio<\/b> (or threads)"], ["CPU-bound", "goroutines on all cores", "<code>ProcessPoolExecutor<\/code>, or native libs (numpy) that release the GIL"], ["Blocking library inside async code", "n/a", "<code>await asyncio.to_thread(fn)<\/code>"]]}, {"t": "tip", "kind": "go", "h": "<b>asyncio is cooperative.<\/b> A task only yields at <code>await<\/code>. A CPU-heavy loop or a blocking call (<code>requests.get<\/code>, <code>time.sleep<\/code>, a sync DB driver) inside <code>async def<\/code> freezes <i>every<\/i> other task. Go's scheduler preempts; asyncio's doesn't."}, {"t": "cmp", "go": "g, ctx := errgroup.WithContext(ctx)   // ctx is cancelled on the first error\nfor _, url := range urls {\n\tg.Go(func() error {               // one goroutine per URL\n\t\treturn fetch(ctx, url)\n\t})\n}\nif err := g.Wait(); err != nil {      // waits for all, returns the first error\n\t// ...\n}", "py": "async with asyncio.TaskGroup() as tg:\n    for url in urls:\n        tg.create_task(fetch(url))\n# leaving the block waits for all tasks;\n# the first failure cancels the siblings\n# and raises an ExceptionGroup", "note": null}, {"t": "run", "code": "import asyncio, time\n\nasync def fetch(name: str, delay: float) -> str:\n    await asyncio.sleep(delay)          # stands in for an HTTP / DB call\n    return f\"{name} done\"\n\nstart = time.perf_counter()\nresults = await asyncio.gather(          # concurrent; results keep order\n    fetch(\"users\", 0.3),\n    fetch(\"orders\", 0.2),\n    fetch(\"prices\", 0.1),\n)\nprint(results, f\"{time.perf_counter() - start:.2f}s (not 0.6s)\")\n\n# In a real program: put this in `async def main()` and call asyncio.run(main()).\n# This runner supports top-level await, so we skip that.", "title": "gather"}, {"t": "h", "h": "Timeouts & cancellation (context.Context)"}, {"t": "run", "code": "import asyncio\n\nasync def slow_llm_call() -> str:\n    try:\n        await asyncio.sleep(5)\n        return \"answer\"\n    except asyncio.CancelledError:\n        print(\"cancelled, cleaning up\")   # like <-ctx.Done()\n        raise                              # ALWAYS re-raise CancelledError\n\ntry:\n    async with asyncio.timeout(0.2):       # context.WithTimeout\n        await slow_llm_call()\nexcept TimeoutError:\n    print(\"timed out\")\n\n# TaskGroup: one failure cancels the rest (errgroup semantics)\nasync def ok(n):\n    await asyncio.sleep(1)\n    return n\n\nasync def boom():\n    await asyncio.sleep(0.1)\n    raise RuntimeError(\"upstream 500\")\n\ntry:\n    async with asyncio.TaskGroup() as tg:\n        tg.create_task(ok(1))\n        tg.create_task(boom())\nexcept* RuntimeError as eg:\n    print(\"group
