e <code>.py<\/code> file; a package is a directory of modules, usually with <code>__init__.py<\/code>.", "mod": "tooling"}, {"id": "gloss-mutable-immutable", "deck": "Glossary", "front": "<b>Mutable / immutable<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "Whether an object can change in place. Lists and dicts can; ints, strings and tuples can't.", "mod": "syntax"}, {"id": "gloss-none", "deck": "Glossary", "front": "<b>None<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "Python's null value; test it with <code>is None<\/code>.", "mod": "syntax"}, {"id": "gloss-opentelemetry", "deck": "Glossary", "front": "<b>OpenTelemetry<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "The vendor-neutral standard and SDKs for traces, metrics and logs.", "mod": "observability"}, {"id": "gloss-protocol", "deck": "Glossary", "front": "<b>Protocol<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "A structural interface from <code>typing<\/code>: any class with matching methods satisfies it, just like Go interfaces.", "mod": "interfaces"}, {"id": "gloss-pydantic", "deck": "Glossary", "front": "<b>pydantic<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "A library for runtime parsing and validation of data into typed models; used at system edges.", "mod": "typing"}, {"id": "gloss-pypi", "deck": "Glossary", "front": "<b>PyPI<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "The Python Package Index, where <code>uv add<\/code> and <code>pip install<\/code> download packages from.", "mod": "tooling"}, {"id": "gloss-rag", "deck": "Glossary", "front": "<b>RAG<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "Retrieval-augmented generation: retrieve relevant passages and put them in the prompt so the model answers from your data.", "mod": "rag"}, {"id": "gloss-set", "deck": "Glossary", "front": "<b>Set<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "An unordered collection of unique items with fast membership checks; Python's <code>map[T]struct{}<\/code>.", "mod": "collections"}, {"id": "gloss-single-flight", "deck": "Glossary", "front": "<b>Single-flight<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "Letting concurrent callers for the same key share one in-progress call instead of each making it.", "mod": "jobs-cache"}, {"id": "gloss-slicing", "deck": "Glossary", "front": "<b>Slicing<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "<code>xs[start:stop:step]<\/code>. On lists it copies; on NumPy arrays it returns a view.", "mod": "collections"}, {"id": "gloss-structured-output", "deck": "Glossary", "front": "<b>Structured output<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "Making an LLM return data that matches a schema (validated with pydantic) instead of free text.", "mod": "typing"}, {"id": "gloss-task", "deck": "Glossary", "front": "<b>Task<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "A scheduled coroutine running concurrently on the event loop (<code>asyncio.create_task<\/code>); roughly a goroutine.", "mod": "concurrency"}, {"id": "gloss-tool-use", "deck": "Glossary", "front": "<b>Tool use<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "An LLM asking your code to run a function by name with JSON arguments, then reading the result.", "mod": "llm-sdk"}, {"id": "gloss-tuple", "deck": "Glossary", "front": "<b>Tuple<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "An ordered, immutable sequence, often used as a lightweight record or a multiple return value.", "mod": "collections"}, {"id": "gloss-type-hint", "deck": "Glossary", "front": "<b>Type hint<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "An annotation like <code>x: int<\/code>, checked by mypy or pyright but not enforced at runtime.", "mod": "typing"}, {"id": "gloss-uv", "deck": "Glossary", "front": "<b>uv<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "A fast all-in-one Python project tool: virtual environments, dependencies, lockfile, Python versions.", "mod": "tooling"}, {"id": "gloss-vectorised", "deck": "Glossary", "front": "<b>Vectorised<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "Operating on whole arrays at once (in C) instead of looping in Python; the key to NumPy and pandas speed.", "mod": "numpy"}, {"id": "gloss-virtual-environment", "deck": "Glossary", "front": "<b>Virtual environment<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "A per-project folder (<code>.venv<\/code>) with its own Python and installed packages.", "mod": "tooling"}, {"id": "gloss-walrus-operator", "deck": "Glossary", "front": "<b>Walrus operator<\/b><span class=\"fc-q\">What does it mean?<\/span>", "back": "<code>:=<\/code> assigns inside an expression: <code>if (hit := cache.get(k)) is not None:<\/code>.", "mod": "jobs-cache"}, {"id": "gotcha-0", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">fns = [lambda: i for i in range(3)]\nprint([f() for f in fns])<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>[2, 2, 2]<\/b><\/p>Closures capture <i>variables<\/i>, not values, and look them up when called. Go 1.22 made loop variables per-iteration; Python never did. Fix it with <code>lambda i=i: i<\/code>.", "mod": "gotchas"}, {"id": "gotcha-1", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">grid = [[0] * 2] * 2\ngrid[0][0] = 1\nprint(grid)<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>[[1, 0], [1, 0]]<\/b><\/p><code>[row] * 2<\/code> repeats a <i>reference<\/i> to the same inner list. Use <code>[[0] * 2 for _ in range(2)]<\/code>.", "mod": "gotchas"}, {"id": "gotcha-2", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">print(0.1 + 0.2 == 0.3, round(2.5), -7 // 2)<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>False 2 -4<\/b><\/p>Floats are IEEE 754 as in Go. <code>round<\/code> uses banker's rounding (half to even), and <code>//<\/code> floors toward negative infinity. Use <code>decimal.Decimal<\/code> or integer cents for money.", "mod": "gotchas"}, {"id": "gotcha-3", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">def f():\n    try:\n        return &quot;try&quot;\n    finally:\n        return &quot;finally&quot;\nprint(f())<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>finally<\/b><\/p><code>finally<\/code> always runs, and a <code>return<\/code> inside it overrides the earlier one (it even swallows exceptions). Never return from <code>finally<\/code>; newer Pythons warn about it.", "mod": "gotchas"}, {"id": "gotcha-4", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">d = {&quot;a&quot;: 1}\nfor k in d:\n    d[&quot;b&quot;] = 2<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>RuntimeError<\/b><\/p><code>RuntimeError: dictionary changed size during iteration<\/code>. Iterate over a snapshot instead: <code>for k in list(d):<\/code>.", "mod": "gotchas"}, {"id": "gotcha-5", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">import asyncio\n\nasync def work():\n    print(&quot;ran&quot;)\n\nwork()\nprint(&quot;done&quot;)<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>done (plus a warning)<\/b><\/p>Calling an <code>async def<\/code> only creates a coroutine object, and nothing runs until it's awaited or scheduled. Python warns <i>coroutine was never awaited<\/i>. In Go terms, it's like forgetting the <code>go<\/code> keyword and the call.", "mod": "gotchas"}, {"id": "gotcha-6", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">t = (1, 2, [3])\nt[2].append(4)\nprint(t)<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>(1, 2, [3, 4])<\/b><\/p>Tuple immutability is <b>shallow<\/b>: the tuple can't be rebound to new items, but a list inside it can still change.", "mod": "gotchas"}, {"id": "gotcha-7", "deck": "Gotchas", "front": "<pre><code class=\"language-python\">def f(x: int) -&gt; int:\n    return x * 2\nprint(f(&quot;ab&quot;))<\/code><\/pre><span class=\"fc-q\">What happens?<\/span>", "back": "<p><b>abab<\/b><\/p>Type hints are never enforced at runtime. Only mypy or pyright in CI would catch this.", "mod": "gotchas"}]};
const MODS = DATA.modules;
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
const KEY = "py4go.v1";
let S = {ex:{}, mod:{}, code:{}, chk:{}, quiz:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const $ = id => document.getElementById(id);
const mainEl = $("main"), navEl = $("nav");
let curId = "home", CUR_BLOCKS = [];

const exercisesOf = m => m.blocks.filter(b => b.t === "ex");
const ALL_EX = MODS.flatMap(exercisesOf);
function modDone(m){ if (S.mod[m.id]) return true; const ex = exercisesOf(m); return ex.length > 0 && ex.every(e => S.ex[e.id]); }

function renderNav(){
  let html = `<a href="#home" class="${curId==='home'?'active':''}"><span class="n">⌂</span><span>Course home</span></a>`;
  const due = fcDueCount();
  html += `<button class="navtool" data-open-search><span class="n">${NAV_ICONS.search}</span><span>Search</span><kbd>${MOD_KEY} K</kbd></button>`;
  html += `<a href="#flashcards" class="${curId==='flashcards'?'active':''}"><span class="n">${NAV_ICONS.cards}</span><span>Flashcards</span>${due?`<span class="cnt" title="${due} cards due">${due}</span>`:""}</a>`;
  html += `<a href="#glossary" class="${curId==='glossary'?'active':''}"><span class="n">${NAV_ICONS.book}</span><span>Glossary</span></a>`;
  html += `<a href="#playground" class="${curId==='playground'?'active':''}"><span class="n">${NAV_ICONS.play}</span><span>Playground</span></a>`;
  html += `<a href="#cheatsheet" class="${curId==='cheatsheet'?'active':''}"><span class="n">${NAV_ICONS.sheet}</span><span>Cheat sheet</span></a>`;
  let last = null;
  MODS.forEach((m, i) => {
    if (m.section !== last){ html += `<div class="sec">${esc(m.section)}</div>`; last = m.section; }
    const d = modDone(m);
    html += `<a href="#${m.id}" class="${curId===m.id?'active':''} ${d?'done':''}"><span class="n">${d?'✓':i+1}</span><span>${esc(m.title)}</span></a>`;
  });
  navEl.innerHTML = html;
  const done = MODS.filter(modDone).length;
  const exDone = ALL_EX.filter(e => S.ex[e.id]).length;
  $("ringVal").style.strokeDashoffset = String(113.1 * (1 - done / MODS.length));
  $("progText").textContent = `${done} of ${MODS.length} modules done, ${exDone} of ${ALL_EX.length} exercises passed`;
  $("topProg").textContent = `${done}/${MODS.length}`;
}

function rows(code){ return Math.min(Math.max(code.split("\n").length + 1, 4), 40); }
function langClass(l){ return "language-" + (l || "plaintext"); }
const pad2 = n => String(n).padStart(2, "0");

function renderBlock(b, i){
  switch (b.t){
    case "p": return `<div class="prose">${b.h.startsWith("<")?b.h:`<p>${b.h}</p>`}</div>`;
    case "h": return `<h3>${b.h}</h3>`;
    case "tip": {
      const L = {go:"Coming from Go", warn:"Watch out", prod:"In production"}[b.kind] || "Note";
      return `<div class="tip tip-${b.kind}"><div class="tip-label">${L}</div>${b.h}</div>`;
    }
    case "cmp": return `<div class="cmp spot" data-b="${i}">
      <div class="cmp-col"><div class="lbl go"><span class="dot"></span>Go</div><pre><code class="language-go">${esc(b.go)}</code></pre></div>
      <div class="cmp-col"><div class="lbl py"><span class="dot"></span>Python<span class="sp"></span><button class="mini ask-btn" data-act="ask">Ask</button></div><pre><code class="language-python">${esc(b.py)}</code></pre></div></div>`;
    case "code": return `<div class="code-block spot" data-b="${i}"><div class="lbl"><span>${esc(b.title||"Code")}</span><span class="sp"></span><button class="mini ask-btn" data-act="ask">Ask</button></div><pre><code class="${langClass(b.lang)}">${esc(b.code)}</code></pre></div>`;
    case "concepts": return `<div class="concepts">${b.items.map(c => `<article class="concept">
        <header><code class="cname">${esc(c.name)}</code>${c.go?`<span class="cgo">Go: ${c.go}</span>`:""}</header>
        <p class="cwhat">${c.what}</p>
        <dl>${c.use?`<dt>Use it when</dt><dd>${c.use}</dd>`:""}${c.avoid?`<dt>Avoid it when</dt><dd>${c.avoid}</dd>`:""}</dl>
        ${c.ex?`<pre><code class="language-python">${esc(c.ex)}</code></pre>`:""}</article>`).join("")}</div>`;
    case "table": return `<div class="tw"><table class="cols-${b.head.length}"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "run": return `<div class="runner spot" data-b="${i}">
      <div class="lbl py"><span class="dot"></span><span class="ttl">Try it</span>${b.title?`<span>${esc(b.title)}</span>`:""}<span class="sp"></span><span class="kbd">Editable, Ctrl/⌘ + Enter runs</span></div>
      <textarea class="ed" rows="${b.play ? Math.max(rows(S.play ?? b.code), 16) : rows(b.code)}" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off" aria-label="Editable Python code">${esc(b.play ? (S.play ?? b.code) : b.code)}</textarea>
      <div class="rb"><button class="btn primary" data-act="run">Run</button><button class="btn" data-act="reset">Reset</button><button class="btn ask-btn" data-act="ask">Ask Claude</button></div>
      <pre class="out" hidden></pre></div>`;
    case "ex": {
      const code = S.code[b.id] ?? b.starter, passed = !!S.ex[b.id];
      return `<div class="ex spot ${passed?'passed':''}" data-b="${i}">
        <div class="exh"><span class="exk">Exercise</span><span class="badge">${passed?'✓ Passed':'Not passed yet'}</span></div>
        <h4>${esc(b.title)}</h4><div class="prose">${b.prompt}</div>
        <textarea class="ed" rows="${rows(code)}" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off" aria-label="Your solution">${esc(code)}</textarea>
        <div class="rb"><button class="btn primary" data-act="check">Check</button><button class="btn" data-act="run">Run only</button><button class="btn" data-act="hint">Hint</button><button class="btn" data-act="solution">Solution</button><button class="btn" data-act="reset">Reset</button><button class="btn ask-btn" data-act="ask">Ask Claude</button></div>
        <div class="hint" hidden>${b.hint}</div>
        <pre class="out" hidden></pre>
        <details class="tests"><summary>View the tests</summary><pre><code class="language-python">${esc(b.tests)}</code></pre></details></div>`;
    }
    case "quiz": {
      const st = S.quiz[b.id] || {};
      const score = Object.entries(st).filter(([k,v]) => b.qs[k] && b.qs[k].a === v).length;
      const all = Object.keys(st).length === b.qs.length;
      return `<div data-quizid="${b.id}" data-b="${i}"><p class="score" data-score>Score: ${score} of ${b.qs.length}${all && score===b.qs.length?", perfect":""}</p>` +
        b.qs.map((q, qi) => {
          const chosen = st[qi];
          const answered = chosen !== undefined;
          return `<div class="q" data-q="${qi}"><div class="qn">Question ${qi+1}: what happens?</div>
            <pre><code class="language-python">${esc(q.code)}</code></pre>
            <div class="opts">${q.opts.map((o, oi) => {
              let cls = "";
              if (answered){ if (oi === q.a) cls = "right"; else if (oi === chosen) cls = "wrong"; }
              return `<button class="opt ${cls}" data-o="${oi}" ${answered?"disabled":""}>${esc(o)}</button>`;
            }).join("")}</div>
            <div class="why" ${answered?"":"hidden"}>${answered?(chosen===q.a?"✅ ":"❌ "):""}${q.why}</div></div>`;
        }).join("") + `<button class="btn" data-quizreset>Reset quiz</button></div>`;
    }
    case "check": {
      const st = S.chk[b.id] || {};
      return `<div class="checklist">${b.items.map((it, k) => `<label class="chk"><input type="checkbox" data-ck="${b.id}:${k}" ${st[k]?"checked":""}><span>${it}</span></label>`).join("")}</div>`;
    }
  }
  return "";
}

let pyPromise = null, pyReady = false, OUT = [];
function setStatus(cls, text){ const el = $("pystatus"); el.className = cls; $("pytext").textContent = text; }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("failed to load " + src)); document.head.appendChild(s); }); }
function getPy(){
  if (!pyPromise){
    pyPromise = (async () => {
      setStatus("loading", "Loading Python 3.12…");
      if (!window.loadPyodide) await loadScript(PYODIDE_URL + "pyodide.js");
      const py = await loadPyodide({ indexURL: PYODIDE_URL });
      py.setStdout({ batched: s => OUT.push(s) });
      py.registerJsModule("course_llm", {
        complete: async (prompt, system) => {
          if (!sample) throw new Error("Claude isn't available in this view; use the fake LLM instead");
          const r = await sample((system ? system + "\n\n" : "") + prompt, { cache: false });
          return r.text;
        },
        available: () => !!sample,
      });
      py.setStderr({ batched: s => OUT.push(s) });
      pyReady = true; setStatus("ready", "Python ready");
      return py;
    })().catch(e => { pyPromise = null; setStatus("error", "Python failed to load"); throw e; });
  }
  return pyPromise;
}
function cleanErr(msg){
  const L = msg.split("\n");
  const i = L.findIndex(l => l.includes('File "<exec>"'));
  if (i < 0) return msg.trim();
  return ["Traceback (most recent call last):", ...L.slice(i)].join("\n").trim();
}
async function runPy(code, tests){
  const py = await getPy();
  try {
    if (/\b(pydantic|pandas|numpy|tzdata|sqlite3)\b/.test(code + (tests || ""))) setStatus("loading", "Loading packages (first time only)…");
    await py.loadPackagesFromImports(code + "\n" + (tests || ""), { messageCallback: () => {} });
  } catch (e) {}
  setStatus("ready", "Python ready");
  const ns = py.globals.get("dict")();
  ns.set("__name__", "__main__");
  OUT = [];
  let err = null;
  try {
    await py.runPythonAsync(code, { globals: ns });
    if (tests) await py.runPythonAsync(tests, { globals: ns });
  } catch (e) {
    err = cleanErr(String(e && e.message || e));
  } finally {
    try { py.runPython("import sys; sys.stdout.flush(); sys.stderr.flush()"); } catch (e) {}
    ns.destroy();
  }
  return { out: OUT.join("\n"), err };
}

let running = false;
async function execute(box, b, code, tests){
  if (running) return;
  running = true;
  const out = box.querySelector(".out");
  const btns = box.querySelectorAll(".rb button");
  out.hidden = false; out.className = "out";
  btns.forEach(x => x.disabled = true);
  out.textContent = pyReady ? "Running…" : "Loading the Python runtime (≈10 MB, first run only)…";
  try {
    const r = await runPy(code, tests);
    let txt = r.out;
    if (r.err){
      out.classList.add("err");
      txt = (tests ? "❌ Not passing yet\n\n" : "") + (txt ? txt + "\n" : "") + r.err;
    } else if (tests){
      out.classList.add("ok");
      txt = "✅ All tests passed!" + (txt ? "\n\n" + txt : "");
      S.ex[b.id] = true; save();
      box.classList.add("passed"); box.querySelector(".badge").textContent = "✓ Passed";
      renderNav();
    }
    out.textContent = txt || "(no output)";
  } catch (e) {
    out.classList.add("err");
    out.textContent = "Couldn't start the Python runtime in this viewer (" + (e && e.message || e) + ").\nTry reloading, or paste the code into a local python3 (3.12+).";
  } finally {
    btns.forEach(x => x.disabled = false);
    running = false;
  }
}

Course modules: ${MODS.map((m, i) => `${i+1}. ${m.title}`).join("; ")}.

function mdInline(t){
  let x = esc(t);
  x = x.replace(/`([^`]+)`/g, "<code>$1</code>");
  x = x.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  x = x.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>");
  return x;
}
function mdBlock(t){
  let html = "", list = null, para = [];
  const fp = () => { if (para.length){ html += `<p>${mdInline(para.join(" "))}</p>`; para = []; } };
  const fl = () => { if (list){ html += `<${list.t}>${list.items.map(i => `<li>${mdInline(i)}</li>`).join("")}</${list.t}>`; list = null; } };
  for (const l of t.split("\n")){
    let m;
    if (!l.trim()){ fp(); fl(); continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))){ fp(); if (!list || list.t !== "ul"){ fl(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ fp(); if (!list || list.t !== "ol"){ fl(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^#{1,6}\s+(.*)/))){ fp(); fl(); html += `<p><b>${mdInline(m[1])}</b></p>`; continue; }
    if (list && /^\s{2,}\S/.test(l)){ list.items[list.items.length - 1] += " " + l.trim(); continue; }
    fl(); para.push(l);
  }
  fp(); fl();
  return html;
}
function md(src){
  return src.split("```").map((part, i) => {
    if (i % 2 === 0) return mdBlock(part);
    const nl = part.indexOf("\n");
    let lang = nl >= 0 ? part.slice(0, nl).trim() : "", code = nl >= 0 ? part.slice(nl + 1) : part;
    if (!/^[\w+-]*$/.test(lang)){ lang = ""; code = part; }
    return `<pre><code class="language-${lang || "python"}">${esc(code.replace(/\n$/, ""))}</code></pre>`;
  }).join("");
}

function stripHtml(h){ const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g, " ").trim(); }

function buildContext(c){

  if (!c) return t;

    if (c.output) t += `\n\nOutput from their last run:\n\`\`\`\n${c.output.slice(0, 3000)}\n\`\`\``;
  }
  return t;
}

async function sendChat(text){
  const q = (text ?? chIn.value).trim();
  if (!q || chat.busy || !sample) return;
  const c = chat.ctx;
  chat.msgs.push({ role: "user", display: q, ctxLabel: c ? c.label : "", content: `[Context]\n${buildContext(c)}\n\n[Question]\n${q}` });
  chat.ctx = null; renderCtx();
  chIn.value = ""; growIn();
  const history = chat.msgs.filter(m => !m.err).map(m => ({ role: m.role, content: m.content }));
  history[0] = { role: "user", content: TUTOR_RULES + "\n\n" + history[0].content };
  const bot = { role: "assistant", content: "" };
  chat.msgs.push(bot);
  chat.busy = true; chat.ctrl = new AbortController();
  chSend.textContent = "Stop";
  renderChat();
  try {
    const r = await sample(history, { cache: false, signal: chat.ctrl.signal, modelTier: "default",
      onText: ({ text }) => { bot.content = text; renderChat(); } });
    bot.content = r.text || bot.content;
  } catch (e) {
    const partial = e && e.text;
    if (chat.ctrl.signal.aborted && (partial || bot.content)){
      bot.content = (partial || bot.content) + "\n\n*(stopped)*";
    } else {
      chat.msgs.pop(); const u = chat.msgs.pop();
      chIn.value = u.display; chat.ctx = c; renderCtx(); growIn();
      const msg = e && e.code === "rate_limited" ? "Too many questions in a short time. Wait a moment, then try again."
        : e && e.code === "not_granted" ? "The tutor isn't available in this view."
        : chat.ctrl.signal.aborted ? "Stopped." : "Something went wrong reaching Claude" + (e && e.message ? `: ${e.message}` : "") + ". Try again.";
      chat.msgs.push({ role: "assistant", content: msg, err: true });
    }
  } finally {
    chat.busy = false; chat.ctrl = null; chSend.textContent = "Send";
    renderChat();
  }
}

/* ---------- search ---------- */
let SEARCH = null, RESULTS = [], SEL = 0;
function buildSearch(){
  const idx = [];
  const add = (kind, label, sub, text, go, w) => idx.push({ kind, label, sub, text: (label + " " + text).toLowerCase(), full: text, go, w });
  MODS.forEach((m, mi) => {
    add("Module", `${mi + 1}. ${m.title}`, m.sub, `${m.sub} ${m.learn.join(" ")} ${m.section}`, { id: m.id }, 6);
    m.blocks.forEach((b, bi) => {
      const go = { id: m.id, bi };
      if (b.t === "h") add("Section", stripHtml(b.h), m.title, "", go, 5);
      else if (b.t === "concepts") b.items.forEach(c => add("Concept", c.name, stripHtml(c.what), `${stripHtml(c.use)} ${stripHtml(c.avoid)}`, go, 5));
      else if (b.t === "ex") add("Exercise", b.title, m.title, stripHtml(b.prompt), go, 4);
      else if (b.t === "run" && b.title) add("Example", b.title, m.title, b.code, go, 3);
      else if (b.t === "code" && b.title) add("Code", b.title, m.title, b.code, go, 3);
      else if (b.t === "p" || b.t === "tip") add("Text", "", m.title, stripHtml(b.h), go, 1);
      else if (b.t === "table") add("Table", stripHtml(b.head.join(" vs ")), m.title, stripHtml(b.rows.flat().join(" ")), go, 2);
      else if (b.t === "check") add("Checklist", "Checklist", m.title, stripHtml(b.items.join(" ")), go, 1);
    });
  });
  DATA.glossary.forEach(g => add("Glossary", g.term, stripHtml(g.def), stripHtml(g.def), { page: "glossary", term: g.term }, 5));
  Object.entries(PAGES).forEach(([id, pg]) => add("Tool", pg.title, pg.blurb, pg.blurb, { page: id }, 6));
  return idx;
}
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function mark(text, terms){
  let out = esc(text);
  terms.filter(t => t.length > 1).forEach(t => { out = out.replace(new RegExp(`(${reEsc(esc(t))})`, "gi"), "<mark>$1</mark>"); });
  return out;
}
function snippet(text, term){
  const i = text.toLowerCase().indexOf(term);
  if (i < 0) return text.slice(0, 110);
  const start = Math.max(0, i - 40);
  return (start ? "…" : "") + text.slice(start, start + 120) + (start + 120 < text.length ? "…" : "");
}
function runSearch(q){
  SEARCH = SEARCH || buildSearch();
  const ql = q.toLowerCase().trim(), terms = ql.split(/\s+/).filter(Boolean);
  const hits = [];
  for (const e of SEARCH){
    if (!terms.every(t => e.text.includes(t))) continue;
    const L = e.label.toLowerCase();
    let score = e.w * 10;
    if (L === ql) score += 60; else if (L.startsWith(ql)) score += 35; else if (L.includes(ql)) score += 20;
    score += terms.filter(t => L.includes(t)).length * 6;
    hits.push({ e, score });
  }
  hits.sort((a, b) => b.score - a.score);
  return hits.slice(0, 40).map(({ e }) => {
    if (e.kind === "Text" || e.kind === "Table" || e.kind === "Checklist")
      return { kind: e.kind === "Text" ? "In text" : e.kind, label: e.sub, sub: snippet(e.full, terms[0]), go: e.go };
    return { kind: e.kind, label: e.label, sub: e.sub, go: e.go };
  });
}
function defaultJumps(){
  const next = MODS.find(m => !modDone(m)) || MODS[0];
  const items = [{ kind: "Continue", label: `${MODS.indexOf(next) + 1}. ${next.title}`, sub: next.sub, go: { id: next.id } }];
  Object.entries(PAGES).forEach(([id, pg]) => items.push({ kind: "Tool", label: pg.title, sub: pg.blurb, go: { page: id } }));
  return items;
}
function renderResults(){
  const q = $("searchIn").value;
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  RESULTS = q.trim() ? runSearch(q) : defaultJumps();
  SEL = 0;
  const list = $("searchRes");
  if (!RESULTS.length){
    list.innerHTML = `<li class="empty">No matches for “${esc(q)}”. Try a single word such as “dict”, “await” or “kafka”.</li>`;
    return;
  }
  list.innerHTML = (q.trim() ? "" : `<li class="grp" aria-hidden="true">Jump to</li>`) + RESULTS.map((r, i) =>
    `<li role="option" id="sr-${i}" data-i="${i}" class="${i === 0 ? "sel" : ""}" aria-selected="${i === 0}"><span class="sk">${esc(r.kind)}</span><span class="sl">${mark(r.label, terms)}</span>${r.sub ? `<span class="ss">${mark(r.sub, terms)}</span>` : ""}</li>`).join("");
  $("searchIn").setAttribute("aria-activedescendant", "sr-0");
}
function moveSel(d){
  if (!RESULTS.length) return;
  const items = $("searchRes").querySelectorAll("li[data-i]");
  items[SEL]?.classList.remove("sel"); items[SEL]?.setAttribute("aria-selected", "false");
  SEL = (SEL + d + RESULTS.length) % RESULTS.length;
  items[SEL].classList.add("sel"); items[SEL].setAttribute("aria-selected", "true");
  items[SEL].scrollIntoView({ block: "nearest" });
  $("searchIn").setAttribute("aria-activedescendant", "sr-" + SEL);
}

/* ---------- flashcards (Leitner spaced repetition) ---------- */
const FC_DAYS = [0, 0, 1, 3, 7, 16];          // review interval by box 1..5
const FC_NEW_PER_DAY = 15;
const FC_DECKS = ["All", ...new Set(DATA.cards.map(c => c.deck))];
S.fc = S.fc || {}; S.fcNew = S.fcNew || {};
let FC = { queue: [], cur: null, flipped: false, cram: false };
function today(){ const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
const deckCards = d => DATA.cards.filter(c => d === "All" || c.deck === d);
function fcDueCount(){ const t = today(); return DATA.cards.filter(c => S.fc[c.id] && S.fc[c.id].due <= t).length; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fcNewLeft(){ return Math.max(0, FC_NEW_PER_DAY - (S.fcNew[today()] || 0)); }
function buildQueue(cram){
  const t = today(), cards = deckCards(S.fcDeck || "All");
  if (cram) return shuffle(cards.slice()).slice(0, 20);
  const due = cards.filter(c => S.fc[c.id] && S.fc[c.id].due <= t);
  const fresh = cards.filter(c => !S.fc[c.id]).slice(0, fcNewLeft());
  return shuffle(due).concat(shuffle(fresh));
}
function startSession(cram){
  FC = { queue: buildQueue(cram), cur: null, flipped: false, cram };
  FC.cur = FC.queue.shift() || null;
}
const dayLabel = n => n <= 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`;
function nextBox(kind){
  const st = S.fc[FC.cur.id], box = st ? st.box : 1;
  return kind === "again" ? 1 : kind === "good" ? Math.min(box + 1, 5) : Math.min(box + 2, 5);
}
function fcStats(){
  const cards = deckCards(S.fcDeck || "All"), t = today();
  return {
    due: cards.filter(c => S.fc[c.id] && S.fc[c.id].due <= t).length,
    fresh: Math.min(fcNewLeft(), cards.filter(c => !S.fc[c.id]).length),
    learned: cards.filter(c => S.fc[c.id] && S.fc[c.id].box >= 4).length,
    total: cards.length,
  };
}
function renderFlashcards(){
  CUR_BLOCKS = [];
  S.fcDeck = FC_DECKS.includes(S.fcDeck) ? S.fcDeck : "All";
  startSession(false);
  mainEl.innerHTML = `<div class="wrap">
    ${toolHero("Flashcards", "Spaced repetition: cards you know come back less often, and cards you miss come back soon. Five minutes a day is plenty.")}
    <div class="fc-decks">${FC_DECKS.map(d => `<button class="chipbtn ${d === S.fcDeck ? "on" : ""}" data-fc-deck="${esc(d)}">${esc(d)}<span>${deckCards(d).length}</span></button>`).join("")}</div>
    <div class="fc-stats" id="fcStats"></div>
    <div id="fcStage"></div>
    <p class="fc-help">Keyboard: <kbd>Space</kbd> shows the answer, then <kbd>1</kbd> Again, <kbd>2</kbd> Good, <kbd>3</kbd> Easy. Progress is saved in this browser.</p>
  </div>`;
  renderFcStage();
}
function renderFcStage(){
  const st = fcStats();
  $("fcStats").innerHTML = `<div><b>${st.due}</b>due now</div><div><b>${st.fresh}</b>new left today</div><div><b>${st.learned}</b>learned</div><div><b>${st.total}</b>cards in deck</div>`;
  const stage = $("fcStage");
  const c = FC.cur;
  if (!c){
    stage.innerHTML = `<div class="fc-done"><h3>${FC.cram ? "Practice round finished" : "All caught up for today"}</h3>
      <p>${FC.cram ? "Nice work. Scheduled reviews are unchanged by extra practice." : "New cards unlock tomorrow, and reviews come back when they're due."}</p>
      <div class="cta-row"><button class="btn primary" data-fc-cram>Practise 20 random cards</button><a class="btn" href="#home">Back to the course</a></div></div>`;
    return;
  }
  const isNew = !S.fc[c.id];
  const lbl = k => dayLabel(FC_DAYS[nextBox(k)]);
  stage.innerHTML = `<div class="fc-card" data-fc-flip tabindex="0" role="button" aria-label="${FC.flipped ? "Answer shown" : "Show the answer"}">
      <span class="fc-deck">${esc(c.deck)}${isNew ? ", new card" : ""}</span>
      <div class="fc-body">${c.front}</div>
      ${FC.flipped ? `<div class="fc-ans">${c.back}</div><a class="fc-mod" href="#${c.mod}">Learn more in ${esc(modLabel(c.mod))}</a>` : `<span class="fc-hint">Think of the answer, then tap the card or press Space.</span>`}
    </div>
    <div class="fc-actions">${FC.flipped
      ? `<button class="btn" data-fc-grade="again">Again<small>${FC.cram ? "practice" : "see it again soon"}</small></button><button class="btn primary" data-fc-grade="good">Good<small>${lbl("good")}</small></button><button class="btn" data-fc-grade="easy">Easy<small>${lbl("easy")}</small></button>`
      : `<button class="btn primary" data-fc-flip>Show answer</button>`}</div>
    <p class="fc-left">${FC.queue.length} more in this ${FC.cram ? "practice round" : "session"}.</p>`;
  if (window.hljs) stage.querySelectorAll("pre code").forEach(el => { try { hljs.highlightElement(el); } catch (e) {} });
}
function fcFlip(){ if (FC.cur && !FC.flipped){ FC.flipped = true; renderFcStage(); } }
function fcGrade(kind){
  const c = FC.cur; if (!c || !FC.flipped) return;
  const t = today(), isNew = !S.fc[c.id], box = nextBox(kind);
  if (!FC.cram || !isNew){ S.fc[c.id] = { box, due: t + FC_DAYS[box] }; if (isNew) S.fcNew[t] = (S.fcNew[t] || 0) + 1; }
  if (kind === "again") FC.queue.push(c);
  save();
  FC.cur = FC.queue.shift() || null; FC.flipped = false;
  renderFcStage(); renderNav();
}

/* ---------- playground ---------- */
const PLAY_SNIPS = {
  "Dataclasses": `# Scratchpad: try anything. Your code is saved in this browser.
# Packages like pandas, numpy and pydantic load automatically when imported.
from dataclasses import dataclass

@dataclass
class Order:
    id: int
    total: float

orders = [Order(1, 30.0), Order(2, 12.5), Order(3, 99.9)]
print(sum(o.total for o in orders))
print(max(orders, key=lambda o: o.total))
`,
  "asyncio": `import asyncio, time

async def fetch(name: str, delay: float) -> str:
    await asyncio.sleep(delay)
    return f"{name} done"

start = time.perf_counter()
print(await asyncio.gather(fetch("a", 0.3), fetch("b", 0.2), fetch("c", 0.1)))
print(f"{time.perf_counter() - start:.2f}s")
`,
  "pandas": `import pandas as pd

df = pd.DataFrame({
    "team": ["api", "api", "agents", "agents", "data"],
    "latency_ms": [120, 340, 900, 1100, 75],
})
print(df.groupby("team")["latency_ms"].agg(["count", "mean", "max"]))
`,
  "pydantic": `from pydantic import BaseModel, Field, ValidationError

class Signup(BaseModel):
    email: str = Field(pattern=r".+@.+")
    age: int = Field(ge=13)

try:
    Signup.model_validate({"email": "nope", "age": "9"})
except ValidationError as e:
    print(e)
`,
  "Empty": "",
};
function renderPlayground(){
  const b = { t: "run", code: PLAY_SNIPS["Dataclasses"], title: "Playground", play: true };
  CUR_BLOCKS = [b];
  mainEl.innerHTML = `<div class="wrap">
    ${toolHero("Playground", "A blank Python 3.12 editor that runs in your browser. Whatever you type is saved here between visits.")}
    <div class="pg-snips"><span>Start from:</span>${Object.keys(PLAY_SNIPS).map(k => `<button class="chipbtn" data-snip="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    ${renderBlock(b, 0)}
  </div>`;
}

/* ---------- cheat sheet ---------- */
function renderCheat(){
  CUR_BLOCKS = [];
  mainEl.innerHTML = `<div class="wrap cheat">
    ${toolHero("Go → Python cheat sheet", "The everyday translations on one page. Print it, or choose “Save as PDF” in the print dialog.")}
    <div class="cheat-actions no-print"><button class="btn primary" data-print>Print or save as PDF</button><p class="print-note">If nothing happens, this viewer blocks printing: open the course in its own browser tab and use the browser's Print command.</p></div>
    <div class="cheat-grid">${DATA.cheat.map(sec => `<section class="cheat-sec"><h3>${esc(sec.title)}</h3><table><thead><tr><th>Go</th><th>Python</th></tr></thead><tbody>${sec.rows.map(([g, p]) => `<tr><td><code>${esc(g)}</code></td><td><code>${esc(p)}</code></td></tr>`).join("")}</tbody></table></section>`).join("")}</div>
  </div>`;
}

const PAGES = {
  flashcards: { title: "Flashcards", blurb: "Spaced-repetition review of concepts, Go → Python mappings, glossary terms and gotchas", render: renderFlashcards },
  glossary: { title: "Glossary", blurb: "Every term in the course, with links to where it's taught", render: renderGlossary },
  playground: { title: "Playground", blurb: "A blank Python editor that runs in your browser and saves your code", render: renderPlayground },
  cheatsheet: { title: "Go → Python cheat sheet", blurb: "A printable one-page reference of everyday translations", render: renderCheat },
};

/* ---------- tool events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-open-search]")){ openSearch(); return; }
  if (t.closest("[data-close-search]")){ closeSearch(); return; }
  if (t.closest("[data-print]")){ try { window.print(); } catch (err) {} return; }
  const deck = t.closest("[data-fc-deck]");
  if (deck){ S.fcDeck = deck.dataset.fcDeck; save(); route(); return; }
  const g = t.closest("[data-fc-grade]");
  if (g){ fcGrade(g.dataset.fcGrade); return; }
  if (t.closest("[data-fc-cram]")){ startSession(true); renderFcStage(); return; }
  if (t.closest("[data-fc-flip]") && !t.closest("a")){ fcFlip(); return; }
  const snip = t.closest("[data-snip]");
  if (snip){
    const ta = mainEl.querySelector("textarea.ed");
    ta.value = PLAY_SNIPS[snip.dataset.snip]; ta.rows = Math.max(rows(ta.value), 16);
    S.play = ta.value; save(); ta.focus(); return;
  }
  const jump = t.closest("[data-gl-jump]");
  if (jump){ const h = document.getElementById("gl-" + jump.dataset.glJump); if (h) window.scrollTo({ top: h.getBoundingClientRect().top + window.scrollY - 90, behavior: RM ? "auto" : "smooth" }); }
});
mainEl.addEventListener("input", e => { if (e.target.id === "glIn") filterGlossary(e.target.value); });
document.addEventListener("keydown", e => {
  const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("searchModal").hidden ? openSearch() : closeSearch(); return; }
  if (!$("searchModal").hidden && e.key === "Escape"){ closeSearch(); return; }
  if (typing || !$("searchModal").hidden) return;
  if (e.key === "/"){ e.preventDefault(); openSearch(); return; }
  if (curId === "flashcards" && FC.cur){
    if ((e.key === " " || e.key === "Enter") && !FC.flipped){ e.preventDefault(); fcFlip(); }
    else if (FC.flipped && ["1", "2", "3"].includes(e.key)) fcGrade({ 1: "again", 2: "good", 3: "easy" }[e.key]);
  }
});

/* ---------- light / dark toggle ---------- */
function applyTheme(dark, animate){
  const root = document.documentElement;
  if (animate && !RM){ root.classList.add("theming"); setTimeout(() => root.classList.remove("theming"), 380); }
  root.classList.toggle("dark", dark);
  document.querySelectorAll("[data-theme-toggle]").forEach(b => {
    b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    const l = b.querySelector(".tl"); if (l) l.textContent = dark ? "Light mode" : "Dark mode";
  });
  try { localStorage.setItem("py4go.theme", dark ? "dark" : "light"); } catch (e) {}
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-theme-toggle]")) applyTheme(!document.documentElement.classList.contains("dark"), true);
});
applyTheme(document.documentElement.classList.contains("dark"), false);

window.addEventListener("hashchange", route);
route();
</script>
